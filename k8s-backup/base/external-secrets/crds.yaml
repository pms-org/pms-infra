---
# External Secrets Operator CRDs
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clustersecretstores.external-secrets.io
spec:
  group: external-secrets.io
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              provider:
                type: object
                properties:
                  aws:
                    type: object
                    properties:
                      service:
                        type: string
                        enum: ["SecretsManager", "ParameterStore"]
                      region:
                        type: string
                      auth:
                        type: object
                        properties:
                          jwt:
                            type: object
                            properties:
                              serviceAccountRef:
                                type: object
                                properties:
                                  name:
                                    type: string
                                required:
                                - name
                            required:
                            - serviceAccountRef
                        required:
                        - jwt
                    required:
                    - service
                    - region
                    - auth
                required:
                - aws
            required:
            - provider
          status:
            type: object
  scope: Cluster
  names:
    plural: clustersecretstores
    singular: clustersecretstore
    kind: ClusterSecretStore
    shortNames:
    - css

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: externalsecrets.external-secrets.io
spec:
  group: external-secrets.io
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              refreshInterval:
                type: string
                default: "1h"
              secretStoreRef:
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                    enum: ["SecretStore", "ClusterSecretStore"]
                required:
                - name
                - kind
              target:
                type: object
                properties:
                  name:
                    type: string
                  creationPolicy:
                    type: string
                    enum: ["Owner", "Merge", "None"]
                    default: "Owner"
                required:
                - name
              data:
                type: array
                items:
                  type: object
                  properties:
                    secretKey:
                      type: string
                    remoteRef:
                      type: object
                      properties:
                        key:
                          type: string
                        property:
                          type: string
                      required:
                      - key
                  required:
                  - secretKey
                  - remoteRef
              dataFrom:
                type: array
                items:
                  type: object
                  properties:
                    extract:
                      type: object
                      properties:
                        key:
                          type: string
                      required:
                      - key
          status:
            type: object
  scope: Namespaced
  names:
    plural: externalsecrets
    singular: externalsecret
    kind: ExternalSecret
    shortNames:
    - es

