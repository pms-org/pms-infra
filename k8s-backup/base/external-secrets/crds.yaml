            properties:
              provider:
                type: object
                properties:
                  aws:
                    type: object
                    properties:
                      service:
                        type: string
                        enum: ["SecretsManager", "ParameterStore"]
                      region:
                        type: string
                      auth:
                        type: object
                        properties:
                          jwt:
                            type: object
                            properties:
                              serviceAccountRef:
                                type: object
                                properties:
                                  name:
                                    type: string
                                required:
                                - name
                            required:
                            - serviceAccountRef
                        required:
                        - jwt
                    required:
                    - service
                    - region
                    - auth
                required:
                - aws
            required:
            - provider
          status:
            type: object
  scope: Namespaced
  names:
