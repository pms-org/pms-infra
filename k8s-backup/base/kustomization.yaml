apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  # Infrastructure Services (with their own kustomizations)
  - infra/postgres/deployment.yaml
  - infra/postgres/service.yaml
  
  - infra/rabbitmq/deployment.yaml
  - infra/rabbitmq/service.yaml
  
  - infra/kafka/  # Includes ConfigMap generator
  
  - infra/schema-registry/  # Includes ConfigMap generator
  
  - infra/redis/deployment.yaml
  - infra/redis/service.yaml
  
  # Application Services (with their own kustomizations)
  - apps/simulation/  # Includes ConfigMap generator
  
  - apps/trade-capture/  # Includes ConfigMap generator
  
  - apps/validation/  # Includes ConfigMap generator

  # AWS Addons
  - aws-addons/secret-store.yaml
  - aws-addons/service-account.yaml

# Namespace for application resources
namespace: pms

labels:
  - pairs:
      managed-by: kustomize
      project: pms
    includeSelectors: false
