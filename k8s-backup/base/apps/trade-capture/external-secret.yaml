apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: trade-capture-secrets
  namespace: pms
spec:
  # Refresh secrets every 1 hour
  refreshInterval: 1h

  # Reference the cluster-wide SecretStore
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  # Target Kubernetes secret to create
  target:
    name: trade-capture-secrets
    creationPolicy: Owner

  # Map AWS Secrets Manager keys to Kubernetes secret keys
  data:
    - secretKey: TRADE_CAPTURE_DB_PASSWORD
      remoteRef:
        key: pms/trade-capture/dev
        property: TRADE_CAPTURE_DB_PASSWORD
    - secretKey: TRADE_CAPTURE_API_KEY
      remoteRef:
        key: pms/trade-capture/dev
        property: TRADE_CAPTURE_API_KEY
    - secretKey: TRADE_CAPTURE_JWT_SECRET
      remoteRef:
        key: pms/trade-capture/dev
        property: TRADE_CAPTURE_JWT_SECRET