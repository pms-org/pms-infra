apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: validation-secrets
  namespace: pms
spec:
  # Refresh secrets every 1 hour
  refreshInterval: 1h

  # Reference the cluster-wide SecretStore
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  # Target Kubernetes secret to create
  target:
    name: validation-secrets
    creationPolicy: Owner

  # Map AWS Secrets Manager keys to Kubernetes secret keys
  data:
    - secretKey: VALIDATION_API_KEY
      remoteRef:
        key: pms/validation/dev
        property: VALIDATION_API_KEY
    - secretKey: VALIDATION_DB_PASSWORD
      remoteRef:
        key: pms/validation/dev
        property: VALIDATION_DB_PASSWORD
    - secretKey: VALIDATION_JWT_SECRET
      remoteRef:
        key: pms/validation/dev
        property: VALIDATION_JWT_SECRET