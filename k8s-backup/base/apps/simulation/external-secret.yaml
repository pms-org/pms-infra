apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: simulation-secrets
  namespace: pms
spec:
  # Refresh secrets every 1 hour
  refreshInterval: 1h

  # Reference the cluster-wide SecretStore
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  # Target Kubernetes secret to create
  target:
    name: simulation-secrets
    creationPolicy: Owner

  # Map AWS Secrets Manager keys to Kubernetes secret keys
  data:
    - secretKey: SIMULATION_DB_PASSWORD
      remoteRef:
        key: pms/simulation/dev
        property: SIMULATION_DB_PASSWORD
    - secretKey: SIMULATION_API_KEY
      remoteRef:
        key: pms/simulation/dev
        property: SIMULATION_API_KEY
    - secretKey: SIMULATION_JWT_SECRET
      remoteRef:
        key: pms/simulation/dev
        property: SIMULATION_JWT_SECRET