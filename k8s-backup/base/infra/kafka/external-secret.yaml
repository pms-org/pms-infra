apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-secrets
  namespace: pms
spec:
  # Refresh secrets every 1 hour
  refreshInterval: 1h

  # Reference the cluster-wide SecretStore
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  # Target Kubernetes secret to create
  target:
    name: kafka-secrets
    creationPolicy: Owner

  # Map AWS Secrets Manager keys to Kubernetes secret keys
  data:
    - secretKey: KAFKA_ADMIN_PASSWORD
      remoteRef:
        key: pms/kafka/dev
        property: KAFKA_ADMIN_PASSWORD
    - secretKey: KAFKA_USER_PASSWORD
      remoteRef:
        key: pms/kafka/dev
        property: KAFKA_USER_PASSWORD