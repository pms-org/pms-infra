apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - external-secret.yaml  # ESO-managed secrets

# ConfigMap Generator - owned by kafka service
configMapGenerator:
  - name: kafka-config
    envs:
      - kafka.properties

# Note: Secret generation moved to external-secret.yaml (ESO)
# This kustomization focuses only on non-secret configuration