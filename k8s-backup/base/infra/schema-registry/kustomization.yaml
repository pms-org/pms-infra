apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# ConfigMap Generator - owned by schema-registry service
configMapGenerator:
  - name: schema-registry-config
    envs:
      - schema-registry.properties

# Note: Secret generation moved to external-secret.yaml (ESO)
# This kustomization focuses only on non-secret configuration