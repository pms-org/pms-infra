      SPRING_PROFILES_ACTIVE: docker

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pmsdb
      DB_USERNAME: pms
      DB_PASSWORD: pms
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pmsdb

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: rabbit-user
      RABBITMQ_PASSWORD: rabbitmq
      SPRING_RABBITMQ_HOST: rabbitmq

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis

      # API Keys
      SIMULATION_API_KEY: sim-api-key-123
      SIMULATION_JWT_SECRET: sim-jwt-secret-456

      # Java Options
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8090:8090"
    networks:
      pms-network:
        ipv4_address: 172.20.0.24
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8090/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ---------------------------------------------------------------------------
  # Analytics Service
  # ---------------------------------------------------------------------------
  analytics:
