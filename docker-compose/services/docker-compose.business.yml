      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pmsdb
      DB_USERNAME: pms
      DB_PASSWORD: pms
      DB_URL: jdbc:postgresql://postgres:5432/pmsdb

      # Redis
      SPRING_REDIS_HOST: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081

      # API Key
      API_KEY: d4jsud1r01qgcb0vck8gd4jsud1r01qgcb0vck90

      # CORS Configuration
      ANALYTICS_CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8080

      # Java Options
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8086:8086"
    networks:
      pms-network:
        ipv4_address: 172.20.0.27
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1"]
