# =============================================================================
# PMS Business Services
# =============================================================================
# Trade Capture, Validation, Simulation, Analytics, RTTM, Leaderboard, etc.
#
# Profile: business
# Start with: docker compose --profile business up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Trade Capture Service
  # ---------------------------------------------------------------------------
  trade-capture:
    # Primary: Build locally
    build:
      context: ../../../pms-trade-capture
      dockerfile: Dockerfile
    image: niishantdev/pms-trade-capture:latest
    # Alternative: Pull from registry (commented out)
    # image: niishantdev/pms-trade-capture:latest
    container_name: pms-trade-capture
    hostname: trade-capture
    restart: unless-stopped
    profiles: ["business", "apps", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: docker

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pmsdb
      DB_USERNAME: pms
      DB_PASSWORD: pms
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pmsdb

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: rabbit-user
      RABBITMQ_PASSWORD: rabbitmq
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: rabbit-user
      SPRING_RABBITMQ_PASSWORD: rabbitmq

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081

      # API Keys
      TRADE_CAPTURE_API_KEY: tc-api-key-123
      TRADE_CAPTURE_JWT_SECRET: tc-jwt-secret-456

      # Java Options
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8083:8083"
    networks:
      pms-network:
        ipv4_address: 172.20.0.22
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ---------------------------------------------------------------------------
  # Validation Service
  # ---------------------------------------------------------------------------
  validation:
    # Primary: Build locally
    build:
      context: ../../../pms-validation
      dockerfile: docker/Dockerfile
    image: niishantdev/pms-validation:latest
    # Alternative: Pull from registry (commented out)
    # image: niishantdev/pms-validation:latest
    container_name: pms-validation
    hostname: validation
    restart: unless-stopped
    profiles: ["business", "apps", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      SPRING_PROFILES_ACTIVE: docker

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pmsdb
      DB_USERNAME: pms
      DB_PASSWORD: pms
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pmsdb
      DB_URL: jdbc:postgresql://postgres:5432/pmsdb

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis
      SPRING_REDIS_HOST: redis

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_CONSUMER_GROUP_ID: validation-consumer-group

      # Kafka Topics
      INCOMING_TRADES_TOPIC: trade.captured
      OUTGOING_VALID_TRADES_TOPIC: trade.validated
      OUTGOING_INVALID_TRADES_TOPIC: trade.rejected

      # RTTM Client Configuration
      RTTM_MODE: kafka
      KAFKA_TOPIC_TRADE_EVENTS: rttm.trade.events
      KAFKA_TOPIC_DLQ_EVENTS: rttm.dlq.events
      KAFKA_TOPIC_QUEUE_METRICS: rttm.queue.metrics
      KAFKA_TOPIC_ERROR_EVENTS: rttm.error.events

      # API Keys
      VALIDATION_API_KEY: val-api-key-123
      VALIDATION_JWT_SECRET: val-jwt-secret-456

      # Java Options
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8085:8085"
    networks:
      pms-network:
        ipv4_address: 172.20.0.23
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ---------------------------------------------------------------------------
  # Simulation Service
  # ---------------------------------------------------------------------------
  simulation:
    # Primary: Build locally
    build:
      context: ../../../pms-simulation
      dockerfile: Dockerfile
    image: niishantdev/pms-simulation:latest
