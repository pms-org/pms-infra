# =============================================================================
# PMS Frontend Services
# =============================================================================
# Angular Frontend Application
#
# Profile: frontend
# Start with: docker compose --profile frontend up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Frontend (Angular)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../../../pms-frontend
      dockerfile: Dockerfile
    image: pms/frontend:latest
    container_name: pms-frontend
    hostname: frontend
    restart: unless-stopped
    profiles: ["frontend", "full"]
    depends_on:
      - apigateway
    environment:
      API_GATEWAY_URL: http://apigateway:8080
    ports:
      - "4200:80"
    networks:
      pms-network:
        ipv4_address: 172.20.0.40
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  pms-network:
    external: true
