# =============================================================================
# PMS Core Services
# =============================================================================
# Auth, API Gateway, Portfolio, Transactional
#
# Profile: core
# Start with: docker compose --profile core up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API Gateway Service
  # ---------------------------------------------------------------------------
  apigateway:
    # Primary: Build locally
    build:
      context: ../../../pms-apigateway
      dockerfile: Dockerfile
    image: niishantdev/pms-apigateway:latest
    # Alternative: Pull from registry (commented out)
    # image: niishantdev/pms-apigateway:latest
    container_name: pms-apigateway
    hostname: apigateway
    restart: unless-stopped
    profiles: ["core", "apps", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pmsdb
      DB_USERNAME: pms
      DB_PASSWORD: pms
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pmsdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: redis

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081

      # Service URLs
      AUTH_SERVICE_URL: http://auth:8082
      TRADE_CAPTURE_SERVICE_URL: http://trade-capture:8083
      VALIDATION_SERVICE_URL: http://validation:8085
      SIMULATION_SERVICE_URL: http://simulation:8090
      PORTFOLIO_SERVICE_URL: http://portfolio:8095
      TRANSACTIONAL_SERVICE_URL: http://transactional:8084

      # Java Options
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8080:8080"
    networks:
      pms-network:
        ipv4_address: 172.20.0.20
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Auth Service
  # ---------------------------------------------------------------------------
  auth:
    # Primary: Build locally
    build:
      context: ../../../pms-auth
      dockerfile: Dockerfile
    image: niishantdev/pms-auth:latest
    # Alternative: Pull from registry (commented out)
    # image: niishantdev/pms-auth:latest
    container_name: pms-auth
    hostname: auth
    restart: unless-stopped
    profiles: ["core", "apps", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: docker

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pmsdb
      DB_USERNAME: pms
      DB_PASSWORD: pms
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pmsdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis

      # JWT Secret
      AUTH_JWT_SECRET: auth-jwt-secret-789
      JWT_SECRET: auth-jwt-secret-789

      # Java Options
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8082:8082"
    networks:
      pms-network:
        ipv4_address: 172.20.0.21
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Portfolio Service
  # ---------------------------------------------------------------------------
  portfolio:
    # Primary: Build locally
    build:
      context: ../../../pms-portfolio
      dockerfile: Dockerfile
    image: niishantdev/pms-portfolio:latest
    # Alternative: Pull from registry (commented out)
    # image: niishantdev/pms-portfolio:latest
    container_name: pms-portfolio
    hostname: portfolio
    restart: unless-stopped
    profiles: ["core", "apps", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8095
      SPRING_PROFILES_ACTIVE: docker

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pmsdb
      DB_USERNAME: pms
      DB_PASSWORD: pms
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pmsdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # Java Options
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8095:8095"
    networks:
      pms-network:
        ipv4_address: 172.20.0.25
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8095/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Transactional Service
  # ---------------------------------------------------------------------------
  transactional:
    # Primary: Build locally
    build:
      context: ../../../PMS-Transactional
      dockerfile: Dockerfile
    image: niishantdev/pms-transactional:latest
    # Alternative: Pull from registry (commented out)
    # image: niishantdev/pms-transactional:latest
    container_name: pms-transactional
    hostname: transactional
    restart: unless-stopped
    profiles: ["core", "apps", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      TRANSACTIONAL_SERVER_PORT: 8084
      SERVER_PORT: 8084
      SPRING_PROFILES_ACTIVE: docker

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pmsdb
      DB_USERNAME: pms
      DB_PASSWORD: pms
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pmsdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081

      # Transactional App Config
      TRANSACTIONAL_BUFFER_SIZE: 50000
      TRANSACTIONAL_OUTBOX_TARGET_LATENCY_MS: 200
      TRANSACTIONAL_OUTBOX_BATCH_MIN: 200
      TRANSACTIONAL_OUTBOX_BATCH_MAX: 500
      TRANSACTIONAL_BATCH_SIZE: 5000
      TRANSACTIONAL_FLUSH_INTERVAL_MS: 10000

      # Kafka Topics
      TRANSACTIONAL_TRANSACTIONS_PUBLISHING_TOPIC: transactions.created
      TRANSACTIONAL_TRANSACTIONS_CONSUMER_GROUP_ID: transactional-transactions-group
      TRANSACTIONAL_TRADES_CONSUMER_DLT_TOPIC: trade.validated.dlt
      TRANSACTIONAL_TRADES_CONSUMER_CONSUMER_ID: transactional-trades-consumer
      TRANSACTIONAL_TRADES_CONSUMER_LISTENING_TOPIC: trade.validated
      TRANSACTIONAL_TRADES_CONSUMER_GROUP_ID: transactional-trades-group

      # Java Options
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8084:8084"
    networks:
      pms-network:
        ipv4_address: 172.20.0.26
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  pms-network:
    external: true
