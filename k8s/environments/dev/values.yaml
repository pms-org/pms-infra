# Development environment values
# This file contains environment-specific overrides for development

# Global settings
global:
  environment: dev
  aws:
    region: us-east-1
    accountId: "123456789012" # Replace with actual AWS account ID
    clusterName: "pms-dev-cluster" # Replace with actual EKS cluster name

# External Secrets Operator configuration
external-secrets:
  enabled: true
  aws:
    region: us-east-1
    irsa:
      roleArn: "arn:aws:iam::123456789012:role/pms-dev-cluster-external-secrets"

# Service-specific overrides
simulation:
  secrets:
    path: pms/dev/simulation

trade-capture:
  secrets:
    path: pms/dev/trade-capture

validation:
  secrets:
    path: pms/dev/validation

# Infrastructure service configurations
postgres:
  enabled: true # Keep enabled to create ExternalName service
  deployment: null # Disable deployment - use RDS instead
  rds:
    endpoint: pms-db-instance-green.cluster-cvk4yqey0ex7.us-east-2.rds.amazonaws.com
  # Connection details for other services
  host: postgres # Services connect to 'postgres' which points to RDS
  port: 5432
  database: pms-db-green
  # RDS credentials will come from AWS Secrets Manager
  secretPath: pms/dev/postgres

rabbitmq:
  enabled: true
  host: rabbitmq
  streamPort: 5552
  amqpPort: 5672
  streamName: trade-stream

kafka:
  enabled: true
  bootstrapServers: kafka:9092
  internalPort: 19092

redis:
  enabled: true
  host: redis
  port: 6379

schema-registry:
  enabled: true
  url: http://schema-registry:8081

# Monitoring and Administration Tools
pgadmin:
  enabled: true
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
  servers:
    - name: "PMS RDS Green (us-east-2)"
      group: "AWS RDS"
      host: pms-db-instance-green.cluster-cvk4yqey0ex7.us-east-2.rds.amazonaws.com
      port: 5432
      database: pms-db-green
      username: postgres
      sslMode: prefer
