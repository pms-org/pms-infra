# Default values for redis chart
# This chart deploys Redis with AI and search modules

# Service configuration
service:
  name: redis
  namespace: pms
  port: 6379
  targetPort: 6379
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: redislabs/redismod
    tag: "latest"
    pullPolicy: IfNotPresent

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Redis command with modules
  command:
    - redis-server
  args:
    - --loadmodule
    - /usr/lib/redis/modules/redisai.so
    - ONNX
    - redisai_onnxruntime/redisai_onnxruntime.so
    - TF
    - redisai_tensorflow/redisai_tensorflow.so
    - TFLITE
    - redisai_tflite/redisai_tflite.so
    - TORCH
    - redisai_torch/redisai_torch.so
    - --loadmodule
    - /usr/lib/redis/modules/redisearch.so
    - --loadmodule
    - /usr/lib/redis/modules/redisgraph.so
    - --loadmodule
    - /usr/lib/redis/modules/redistimeseries.so

# Redis configuration (non-secret)
config: {}

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/redis/dev

  # Refresh interval
  refreshInterval: 1h

  # Secret key mappings
  data:
    - secretKey: REDIS_PASSWORD
      remoteKey: REDIS_PASSWORD
