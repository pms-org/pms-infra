# Default values for redis chart
# This chart deploys Redis with Sentinel for high availability

# Service configuration
service:
  name: redis
  port: 6379
  targetPort: 6379
  type: ClusterIP

# Sentinel configuration
sentinel:
  name: redis-sentinel
  port: 26379
  replicas: 3
  masterName: pms-redis
  quorum: 2
  downAfterMilliseconds: 5000
  failoverTimeout: 10000
  parallelSyncs: 1

# Redis Master/Replica configuration
redis:
  replicas: 3 # 1 master + 2 replicas (master elected automatically)
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Persistence
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "gp3"

  # General Redis settings (NOT cluster mode)
  config:
    maxmemory: "256mb"
    maxmemoryPolicy: "allkeys-lru"
    appendonly: "yes"
    appendfsync: "everysec"
    savePolicy: "900 1 300 10 60 10000"

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/redis

  # Refresh interval
  refreshInterval: 1h

  # Secret key mappings
  data:
    - secretKey: REDIS_PASSWORD
      remoteKey: REDIS_PASSWORD
