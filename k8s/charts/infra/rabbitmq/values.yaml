# Default values for rabbitmq chart
# This chart deploys RabbitMQ with stream plugin

# Service configuration
service:
  name: rabbitmq
  namespace: pms
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
    - name: stream
      port: 5552
      targetPort: 5552
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: rabbitmq
    tag: "3.13-management"
    pullPolicy: IfNotPresent

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Custom command to enable stream plugin
  command:
    - bash
    - -c
    - |
      rabbitmq-plugins enable rabbitmq_stream &&
      rabbitmq-server

# Persistence configuration
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClassName: "" # Use default storage class

# RabbitMQ configuration (non-secret)
config:
  # Default vhost configuration
  RABBITMQ_DEFAULT_VHOST: "/"
  # Configure RabbitMQ to advertise service hostname for stream clients
  RABBITMQ_USE_LONGNAME: "false"
  # Override the advertised hostname for stream protocol and configure exit behavior
  RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_stream advertised_host rabbitmq -rabbitmq_stream exit_on_failure false"

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/rabbitmq

  # Refresh interval
  refreshInterval: 1h

  # Secret key mappings
  data:
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteKey: RABBITMQ_DEFAULT_USER
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteKey: RABBITMQ_DEFAULT_PASS
