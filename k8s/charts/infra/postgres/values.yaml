# Default values for postgres chart
# This chart deploys PostgreSQL database

# Service configuration
service:
  name: postgres
  namespace: pms
  port: 5432
  targetPort: 5432
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Persistence configuration
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClassName: "" # Use default storage class

# Database configuration (non-secret)
config:
  POSTGRES_DB: pmsdb
  POSTGRES_USER: pms

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/database

  # Refresh interval
  refreshInterval: 1h

  # Secret key mappings - map canonical AWS names to postgres-specific names
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteKey: DB_PASSWORD
