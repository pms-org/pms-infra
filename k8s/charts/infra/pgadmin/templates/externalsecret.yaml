apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.service.name }}-secrets
  namespace: {{ .Values.service.namespace }}
spec:
  # Refresh secrets every configured interval
  refreshInterval: {{ .Values.secrets.refreshInterval }}

  # Reference the cluster-wide SecretStore
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  # Target Kubernetes secret to create
  target:
    name: {{ .Values.service.name }}-secrets
    creationPolicy: Owner

  # Map AWS Secrets Manager keys to Kubernetes secret keys
  data:
{{- range .Values.secrets.data }}
  - secretKey: {{ .secretKey }}
    remoteRef:
      key: {{ $.Values.secrets.path }}
      property: {{ .remoteKey }}
{{- end }}
  # Also fetch RDS password for server configuration
  - secretKey: RDS_PASSWORD
    remoteRef:
      key: pms/dev/postgres
      property: password
