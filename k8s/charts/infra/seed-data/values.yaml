# Default values for seed-data chart
# This chart deploys a one-time job to seed database with reference data

# Job configuration
job:
  name: seed-data
  namespace: pms

# Dependencies to wait for
dependencies:
  postgres:
    host: postgres
    port: 5432
  kafka:
    host: kafka
    port: 19092
  schemaRegistry:
    host: schema-registry
    port: 8081

# Database configuration
database:
  host: postgres
  port: 5432
  name: pmsdb
  user: pms
  password: pms123

# Wait image for init containers
waitImage: busybox:1.36

# Postgres client image
postgresImage: postgres:16.11-alpine

# Seed data configuration
seedData:
  # Portfolio investor details - reference data for validation
  portfolios:
    - id: "3f2c1d4e-8b57-4a92-9c65-b5e6f4e19b73"
