# Default values for auth service
# This chart deploys the PMS auth microservice

# Service configuration
service:
  name: auth
  namespace: pms
  port: 8081
  targetPort: 8081
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: niishantdev/pms-auth
    tag: latest
    pullPolicy: Always

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Health check probes
  healthChecks:
    enabled: false
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /actuator/health/liveness
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  # Generic wait image for init containers
  waitImage: &waitImage "busybox:1.36"

  # Dependencies list - data-driven approach for init containers
  dependencies:
    - name: postgres
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"
    - name: apigateway
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z apigateway 8080; do echo waiting for api-gateway; sleep 2; done"

# Application configuration (non-secret)
config:
  DB_HOST: postgres
  DB_NAME: pmsdb
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pmsdb
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://apigateway:8080/oauth2/jwks

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/auth

  # Refresh interval
  refreshInterval: 1h

  # Secret key mappings
  data:
    - secretKey: DATASOURCE_USER
      remoteKey: DATASOURCE_USER
    - secretKey: DATASOURCE_PASS
      remoteKey: DATASOURCE_PASS
    - secretKey: JWT_SECRET
      remoteKey: JWT_SECRET

  # Toggle between External Secrets and fallback secrets
  useExternalSecrets: false

  # Fallback secrets (used when useExternalSecrets: false)
  fallback:
    datasourceUser: pms
    datasourcePass: pmspassword
    jwtSecret: dev-jwt-secret-change-in-production
