# Default values for auth service
# This chart deploys the PMS auth microservice

# Service configuration
service:
  name: auth
  namespace: pms
  port: 8081
  targetPort: 8081
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    # repository: neha544/pms-auth
    repository: niishantdev/pms-auth
    tag: latest
    pullPolicy: Always

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Health check probes
  healthChecks:
    enabled: false
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /actuator/health/liveness
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  # Generic wait image for init containers
  waitImage: &waitImage "busybox:1.36"

  # Dependencies list - data-driven approach for init containers
  dependencies:
    - name: postgres
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"
    - name: apigateway
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z apigateway 8088; do echo waiting for api-gateway; sleep 2; done"

# Application configuration (non-secret)
config:
  # Note: DB_HOST, DB_PORT, DB_NAME come from global config
  # Service-specific config only
  SERVER_PORT: "8081"

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/auth

  # Refresh interval
  refreshInterval: 1h

  # Service-specific secret key mappings (Global secrets come from pms-global-secrets)
  data:
    - secretKey: AUTH_JWT_SECRET
      remoteKey: AUTH_JWT_SECRET

  # Toggle between External Secrets and fallback secrets
  useExternalSecrets: false

  # Fallback secrets (used when useExternalSecrets: false)
  fallback:
    datasourceUser: pms
    datasourcePass: pmspassword
    jwtSecret: dev-jwt-secret-change-in-production
