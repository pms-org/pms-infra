# Default values for validation service
# This chart deploys the PMS Validation microservice

# Service configuration
service:
  name: validation-service
  namespace: pms
  port: 8080
  targetPort: 8080
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  image:
    repository: niishantdev/pms-validation
    tag: latest
    pullPolicy: IfNotPresent

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Init containers for dependency checking
  initContainers:
    postgres:
      enabled: true
      image: busybox:1.36
      command:
        [
          "sh",
          "-c",
          "until /bin/nc -z postgres 5432; do echo waiting for postgres; sleep 2; done",
        ]
    redis:
      enabled: true
      image: busybox:1.36
      command:
        [
          "sh",
          "-c",
          "until /bin/nc -z redis 6379; do echo waiting for redis; sleep 2; done",
        ]
    kafka:
      enabled: true
      image: busybox:1.36
      command:
        [
          "sh",
          "-c",
          "until /bin/nc -z kafka 19092; do echo waiting for kafka; sleep 2; done",
        ]
    schemaRegistry:
      enabled: true
      image: busybox:1.36
      command:
        [
          "sh",
          "-c",
          "until /bin/nc -z schema-registry 8081; do echo waiting for schema-registry; sleep 2; done",
        ]

# Application configuration (non-secret)
config:
  SPRING_APPLICATION_NAME: validation
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: pmsdb
  DATASOURCE_DRIVER: org.postgresql.Driver
  HIBERNATE_DDL_AUTO: update
  HIBERNATE_SHOW_SQL: "false"
  HIBERNATE_FORMAT_SQL: "true"
  HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_TIMEOUT: 2s
  CACHE_TYPE: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_CONSUMER_GROUP_ID: validation-consumer-group
  SCHEMA_REGISTRY_URL: http://schema-registry:8081
  SERVER_PORT: "8080"
  INCOMING_TRADES_TOPIC: raw-trades-topic
  OUTGOING_VALID_TRADES_TOPIC: valid-trades-topic
  OUTGOING_INVALID_TRADES_TOPIC: invalid-trades-topic
  LOGGING_LEVEL: DEBUG

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/validation

  # Refresh interval
  refreshInterval: 1h

  # Secret key mappings
  data:
    - secretKey: VALIDATION_API_KEY
      remoteKey: VALIDATION_API_KEY
    - secretKey: VALIDATION_DB_PASSWORD
      remoteKey: VALIDATION_DB_PASSWORD
    - secretKey: VALIDATION_JWT_SECRET
      remoteKey: VALIDATION_JWT_SECRET
    - secretKey: SPRING_RABBITMQ_USERNAME
      remoteKey: SPRING_RABBITMQ_USERNAME
    - secretKey: SPRING_RABBITMQ_PASSWORD
      remoteKey: SPRING_RABBITMQ_PASSWORD
    - secretKey: APP_RABBIT_STREAM_USERNAME
      remoteKey: SPRING_RABBITMQ_USERNAME
    - secretKey: APP_RABBIT_STREAM_PASSWORD
      remoteKey: SPRING_RABBITMQ_PASSWORD

# External Secrets Operator dependency
external-secrets:
  enabled: true
