# Default values for validation service
# This chart deploys the PMS Validation microservice

# Service configuration
service:
  name: validation-service
  namespace: pms
  port: 8080
  targetPort: 8080
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  image:
    repository: sureshvasantha/pms-validation
    tag: latest
    pullPolicy: Always

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Health check probes
  healthChecks:
    enabled: true # ENABLED: Critical - transactional service depends on validation being ready
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /actuator/health/liveness
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  # Generic wait image for init containers
  waitImage: &waitImage "busybox:1.36"

  # Dependencies list - data-driven approach for init containers
  dependencies:
    - name: postgres
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"
    - name: redis
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"
    - name: trade-capture
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z trade-capture 8082; do echo waiting for trade-capture service; sleep 2; done"
    - name: kafka
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z kafka 19092; do echo waiting for kafka; sleep 2; done"
    - name: schema-registry
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z schema-registry 8081; do echo waiting for schema-registry; sleep 2; done"

# Application configuration (non-secret)
config:
  # Note: DB_HOST, DB_PORT, DB_NAME, REDIS_HOST, REDIS_PORT, REDIS_TIMEOUT,
  # CACHE_TYPE, KAFKA_BOOTSTRAP_SERVERS, SCHEMA_REGISTRY_URL,
  # INCOMING_TRADES_TOPIC, OUTGOING_VALID_TRADES_TOPIC, OUTGOING_INVALID_TRADES_TOPIC
  # All come from global config in pms-platform

  # Service-specific config
  SERVER_PORT: "8080"
  # DB_DDL_AUTO: "update"
  DB_FORMAT_SQL: "true"
  JPA_JDBC_BATCH_SIZE: "50"
  JPA_ORDER_INSERTS: "true"
  JPA_ORDER_UPDATES: "true"
  KAFKA_CONSUMER_GROUP_ID: "validation-consumer-group"
  VALIDATION_CONSUMER_GROUP: "validation-consumer-group"
  LOGGING_LEVEL: "DEBUG"

  # Kafka producer configuration
  KAFKA_PRODUCER_ACKS: "all"
  KAFKA_PRODUCER_RETRIES: "3"

  # RTTM client configuration
  RTTM_MODE: "kafka"
  RTTM_SEND_TIMEOUT_MS: "3000"
  RTTM_RETRY_MAX_ATTEMPTS: "3"
  RTTM_RETRY_BACKOFF_MS: "100"
  RTTM_METRICS_INTERVAL_MS: "30000"

  # RTTM Kafka topics
  KAFKA_TOPIC_TRADE_EVENTS: "rttm.trade.events"
  KAFKA_TOPIC_DLQ_EVENTS: "rttm.dlq.events"
  KAFKA_TOPIC_QUEUE_METRICS: "rttm.queue.metrics"
  KAFKA_TOPIC_ERROR_EVENTS: "rttm.error.events"

  # Validation configuration
  VALIDATION_BUFFER_SIZE: "50"
  VALIDATION_BATCH_SIZE: "1000"
  VALIDATION_FLUSH_INTERVAL_MS: "5000"

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/validation

  # Refresh interval
  refreshInterval: 1h

  # Service-specific secret key mappings (Global secrets come from pms-global-secrets)
  data:
    - secretKey: VALIDATION_API_KEY
      remoteKey: VALIDATION_API_KEY
    - secretKey: VALIDATION_JWT_SECRET
      remoteKey: VALIDATION_JWT_SECRET

# External Secrets Operator dependency
external-secrets:
  enabled: true
