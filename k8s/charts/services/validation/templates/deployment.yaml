apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.service.namespace }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  strategy:
    type: {{ .Values.deployment.strategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.deployment.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.deployment.strategy.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app: {{ .Values.service.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.service.name }}
    spec:
      initContainers:
      {{- /* Loop through the dependencies list */}}
      {{- range .Values.deployment.dependencies }}
      {{- if .enabled }}
      - name: wait-for-{{ .name }}
        image: {{ .image }}
        command:
          {{- toYaml .command | nindent 10 }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ .Values.service.name }}
        image: {{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}
        imagePullPolicy: {{ .Values.deployment.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        env:
        # Spring Boot Redis Sentinel configuration (maps to spring.data.redis.sentinel.*)
        - name: SPRING_DATA_REDIS_SENTINEL_MASTER
          value: {{ .Values.global.config.REDIS_SENTINEL_MASTER | quote }}
        - name: SPRING_DATA_REDIS_SENTINEL_NODES
          value: "{{ .Values.global.config.REDIS_SENTINEL_HOST }}:{{ .Values.global.config.REDIS_SENTINEL_PORT }}"
        - name: SPRING_DATA_REDIS_TIMEOUT
          value: {{ .Values.global.config.REDIS_TIMEOUT | quote }}
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pms-global-secrets
              key: REDIS_PASSWORD
        envFrom:
        # Global config (DB, Redis, RabbitMQ, Kafka, etc.)
        - configMapRef:
            name: pms-global-config
        # Service-specific config
        - configMapRef:
            name: {{ .Values.service.name }}-config
        # Global secrets (DB_USERNAME, DB_PASSWORD, RABBITMQ_USERNAME, RABBITMQ_PASSWORD, REDIS_PASSWORD)
        - secretRef:
            name: pms-global-secrets
        # Service-specific secrets
        - secretRef:
            name: {{ .Values.service.name }}-secrets
        resources: {{ toYaml .Values.deployment.resources | nindent 10 }}
        {{- if .Values.deployment.healthChecks.enabled }}
        {{- include "validation.livenessProbe" . | nindent 8 }}
        {{- include "validation.readinessProbe" . | nindent 8 }}
        {{- include "validation.startupProbe" . | nindent 8 }}
        {{- end }}