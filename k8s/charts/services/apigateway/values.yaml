# Default values for apigateway service
# This chart deploys the PMS apigateway microservice

# Service configuration
service:
  name: apigateway
  namespace: pms
  port: 8088
  targetPort: 8088
  type: ClusterIP # Changed from LoadBalancer - now accessible via ingress only
  # Removed LoadBalancer annotations - no longer needed with ingress

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: niishantdev/pms-apigateway
    tag: latest
    pullPolicy: Always

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Health check probes
  healthChecks:
    enabled: false
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /actuator/health/liveness
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  # Generic wait image for init containers
  waitImage: &waitImage "busybox:1.36"

  # Dependencies list - data-driven approach for init containers
  dependencies:
    - name: redis
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"

# Application configuration (non-secret)
config:
  # Note: REDIS_HOST, REDIS_PORT, AUTH_SERVICE_HOST, AUTH_SERVICE_PORT,
  # SIMULATION_SERVICE_HOST, SIMULATION_SERVICE_PORT, VALIDATION_SERVICE_HOST, VALIDATION_SERVICE_PORT
  # All come from global config in pms-platform

  # Service-specific config
  SERVER_PORT: "8088"
  GATEWAY_CONNECT_TIMEOUT: "3000"
  GATEWAY_RESPONSE_TIMEOUT: "10s"
  GATEWAY_CORS_ORIGINS: "*"
  GATEWAY_CORS_CREDENTIALS: "false"
  LOG_LEVEL_GATEWAY: DEBUG
  LOG_LEVEL_OAUTH2: DEBUG
  LOG_LEVEL_NETTY: INFO

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/apigateway

  # Refresh interval
  refreshInterval: 1h

  # Secret key mappings (if any secrets needed, e.g., for redis auth)
  data: []
