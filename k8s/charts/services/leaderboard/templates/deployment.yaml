apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.service.namespace }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.service.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.service.name }}
    spec:
      initContainers:
      {{- range .Values.deployment.dependencies }}
      {{- if .enabled }}
      - name: wait-for-{{ .name }}
        image: {{ .image }}
        command:
          {{- toYaml .command | nindent 10 }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ .Values.service.name }}
        image: {{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}
        imagePullPolicy: {{ .Values.deployment.image.pullPolicy }}
        resources: {{ toYaml .Values.deployment.resources | nindent 10 }}
        env:
        # Spring Boot Redis Sentinel configuration (maps to spring.data.redis.sentinel.*)
        - name: SPRING_DATA_REDIS_SENTINEL_MASTER
          value: {{ .Values.global.config.REDIS_SENTINEL_MASTER | quote }}
        - name: SPRING_DATA_REDIS_SENTINEL_NODES
          value: "{{ .Values.global.config.REDIS_SENTINEL_HOST }}:{{ .Values.global.config.REDIS_SENTINEL_PORT }}"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pms-global-secrets
              key: REDIS_PASSWORD
        envFrom:
        # Global config (DB_HOST, DB_PORT, DB_NAME, KAFKA_BOOTSTRAP_SERVERS, etc.)
        - configMapRef:
            name: pms-global-config
        # Service-specific config (KAFKA topics, consumer group, etc.)
        - configMapRef:
            name: {{ .Values.service.name }}-config
        # Global secrets (DB_USERNAME, DB_PASSWORD, REDIS_PASSWORD)
        - secretRef:
            name: pms-global-secrets
        {{- if and .Values.secrets.enabled (gt (len .Values.secrets.data) 0) }}
        # Service-specific secrets (if any)
        - secretRef:
            name: {{ .Values.service.name }}-secrets
        {{- end }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        {{- if .Values.deployment.healthChecks.enabled }}
        {{- include "leaderboard.livenessProbe" . | nindent 8 }}
        {{- include "leaderboard.readinessProbe" . | nindent 8 }}
        {{- include "leaderboard.startupProbe" . | nindent 8 }}
        {{- end }}
