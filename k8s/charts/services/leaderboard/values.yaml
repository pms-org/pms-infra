# Default values for leaderboard service
# This chart deploys the PMS Leaderboard microservice

# Service configuration
service:
  name: leaderboard
  namespace: pms
  port: 8000
  targetPort: 8000
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: niishantdev/pms-leaderboard
    tag: latest
    pullPolicy: Always

  # Resource limits and requests
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Health check probes
  healthChecks:
    enabled: true
    liveness:
      path: /actuator/health
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /actuator/health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  # Generic wait image for init containers
  waitImage: &waitImage "busybox:1.36"

  # Dependencies list - data-driven approach for init containers
  dependencies:
    - name: postgres
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"
    - name: redis
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z redis-sentinel 26379; do echo waiting for redis sentinel; sleep 2; done"
    - name: kafka
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z kafka 19092; do echo waiting for kafka; sleep 2; done"

# Application configuration (non-secret)
config:
  # Note: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD come from global secrets/config

  # Database configuration
  # DB_DDL_AUTO: "update"
  DB_SHOW_SQL: "false"

  # Service-specific config
  SERVER_PORT: "8000"
  SPRING_PROFILES_ACTIVE: "docker"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_PMS_LEADERBOARD: "DEBUG"

  # Kafka configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  KAFKA_CONSUMER_GROUP_ID: "leaderboard-group"
  KAFKA_CONSUMER_MAX_POLL_RECORDS: "500"
  KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: "true"
  KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"
  KAFKA_RISK_TOPIC: "portfolio-risk-metrics"

  # Redis Sentinel configuration - matches application-docker.yaml expectations
  # Application expects: REDIS_HOST for sentinel master name, REDIS_SENTINEL_NODES for nodes
  # These values are set from global config in deployment template
  REDIS_HOST: "pms-redis"
  REDIS_SENTINEL_NODES: "redis-sentinel:26379"
  REDIS_READ_FROM: "REPLICA_PREFERRED"
  REDIS_TIMEOUT: "10s"

# Secrets configuration (AWS Secrets Manager)
# Leaderboard service uses global secrets (DB_USERNAME, DB_PASSWORD, REDIS_PASSWORD)
# from pms-global-secrets created by the pms-platform umbrella chart
secrets:
  enabled: true
  refreshInterval: 1h
  path: "pms/dev/leaderboard"
  data:
    - secretKey: LEADERBOARD_API_KEY
      remoteKey: LEADERBOARD_API_KEY
    - secretKey: LEADERBOARD_JWT_SECRET
      remoteKey: LEADERBOARD_JWT_SECRET
