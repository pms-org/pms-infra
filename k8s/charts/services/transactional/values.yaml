# Default values for transactional service
# This chart deploys the PMS transactional microservice

# Service configuration
service:
  name: transactional
  namespace: pms
  port: 8084
  targetPort: 8084
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: kovidms/pms-transactional
    tag: latest
    pullPolicy: Always

  # Resource limits and requests
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Health check probes
  healthChecks:
    enabled: false # DISABLED: No spring-boot-starter-actuator in pom.xml - /actuator/health endpoint doesn't exist
    liveness:
      path: /actuator/health
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /actuator/health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  # Generic wait image for init containers
  waitImage: &waitImage "busybox:1.36"

  # Dependencies list - data-driven approach for init containers
  dependencies:
    - name: rds-postgres
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z pms-db-instance-green.cluster-cvk4yqey0ex7.us-east-2.rds.amazonaws.com 5432; do echo waiting for RDS postgres; sleep 2; done"
    - name: kafka
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z kafka 19092; do echo waiting for kafka; sleep 2; done"
    - name: schema-registry
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z schema-registry 8081; do echo waiting for schema-registry; sleep 2; done"
    - name: validation
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z validation-service 8080; do echo waiting for validation; sleep 2; done"

# Application configuration (non-secret)
config:
  # Note: DB_HOST, DB_PORT, DB_NAME come from global config in pms-platform

  # Service-specific config
  DB_DDL_AUTO: "update"
  DB_SHOW_SQL: "false"
  TRANSACTIONAL_JDBC_BATCH_SIZE: "1000"
  TRANSACTIONAL_SERVER_PORT: "8084"
  TRANSACTIONAL_BATCH_SIZE: "5000"
  TRANSACTIONAL_BUFFER_SIZE: "50"

  TRANSACTIONAL_OUTBOX_TARGET_LATENCY_MS: "100"
  TRANSACTIONAL_OUTBOX_BATCH_MIN: "500"
  TRANSACTIONAL_OUTBOX_BATCH_MAX: "1000"
  TRANSACTIONAL_OUTBOX_BATCH_SIZE: "1000"
  TRANSACTIONAL_FLUSH_INTERVAL_MS: "500"

  # Kafka topic configuration
  TRANSACTIONAL_TRANSACTIONS_PUBLISHING_TOPIC: "transactional-trades-topic"
  TRANSACTIONAL_TRANSACTIONS_CONSUMER_GROUP_ID: "transactional-trades-consumer-group"
  TRANSACTIONAL_TRADES_CONSUMER_LISTENING_TOPIC: "valid-trades-topic"
  TRANSACTIONAL_TRADES_CONSUMER_GROUP_ID: "transactional-trades-consumer-group"
  TRANSACTIONAL_TRADES_CONSUMER_CONSUMER_ID: "transactional-trades-consumer-1"
  TRANSACTIONAL_TRADES_CONSUMER_DLT_TOPIC: "transactional-trades-dlt"
