# Default values for frontend service
# This chart deploys the PMS Frontend (Angular) application

# Service configuration
service:
  name: frontend
  namespace: pms
  port: 80
  targetPort: 80
  type: ClusterIP # Changed from LoadBalancer - now accessible via ingress only
  # Removed LoadBalancer annotations - no longer needed with ingress

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: niishantdev/pms-frontend
    tag: latest
    pullPolicy: Always

  # Resource limits and requests
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Health check probes (nginx)
  healthChecks:
    enabled: true
    liveness:
      path: /
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 10

# Application configuration (non-secret)
config:
  # Nginx configuration
  NGINX_PORT: "80"

# Runtime environment configuration for frontend
# These values are injected into env.js at deployment time via ConfigMap
# The same frontend container image works across all environments (dev/stage/prod)
#
# INGRESS MODE: Frontend and API Gateway are accessible through the SAME ALB
# Browser origin: http://k8s-pms-pmsingre-ba04040d46-627579414.us-east-1.elb.amazonaws.com
# All requests go through ALB (same-origin) - NO CORS needed!
#
# To change endpoints for a specific environment:
# 1. Edit pms-platform/values.yaml under frontend.runtimeConfig
# 2. Run: helm upgrade --install pms-platform pms-platform --namespace pms
# 3. Frontend pods will automatically pick up the new configuration
#
# No frontend rebuild or image push required - this is runtime configuration!
runtimeConfig:
  # API Gateway through internet-facing NLB (HTTP port 8088)
  API_GATEWAY_HTTP: "http://k8s-pms-apigatew-6edef58215-9da0932f585af4ad.elb.us-east-1.amazonaws.com:8088"
  API_GATEWAY_WS: "ws://k8s-pms-apigatew-6edef58215-9da0932f585af4ad.elb.us-east-1.amazonaws.com:8088"

  # All other services route through API Gateway
  # Frontend should ONLY talk to API Gateway (single entry point pattern)
  AUTH_HTTP: "http://k8s-pms-apigatew-6edef58215-9da0932f585af4ad.elb.us-east-1.amazonaws.com:8088"

  # Portfolio Service
  PORTFOLIO_HTTP: "http://k8s-pms-apigatew-6edef58215-9da0932f585af4ad.elb.us-east-1.amazonaws.com:8088"
  PORTFOLIO_WS: "ws://k8s-pms-apigatew-6edef58215-9da0932f585af4ad.elb.us-east-1.amazonaws.com:8088"

  # Analytics Service
  ANALYTICS_HTTP: "http://k8s-pms-apigatew-6edef58215-9da0932f585af4ad.elb.us-east-1.amazonaws.com:8088"
  ANALYTICS_WS: "ws://k8s-pms-apigatew-6edef58215-9da0932f585af4ad.elb.us-east-1.amazonaws.com:8088"

  # Leaderboard Service
  LEADERBOARD_HTTP: "http://k8s-pms-apigatew-6edef58215-9da0932f585af4ad.elb.us-east-1.amazonaws.com:8088"
  LEADERBOARD_WS: "ws://k8s-pms-apigatew-6edef58215-9da0932f585af4ad.elb.us-east-1.amazonaws.com:8088"

  # RTTM Service
  RTTM_HTTP: "http://k8s-pms-apigatew-6edef58215-9da0932f585af4ad.elb.us-east-1.amazonaws.com:8088"
  RTTM_WS: "ws://k8s-pms-apigatew-6edef58215-9da0932f585af4ad.elb.us-east-1.amazonaws.com:8088"

# Secrets configuration (AWS Secrets Manager)
secrets:
  # Leave empty - frontend doesn't need database secrets
  data: []
