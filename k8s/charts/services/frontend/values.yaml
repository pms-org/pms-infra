# Default values for frontend service
# This chart deploys the PMS Frontend (Angular) application

# Service configuration
service:
  name: frontend
  namespace: pms
  port: 80
  targetPort: 80
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: niishantdev/pms-frontend
    tag: latest
    pullPolicy: Always

  # Resource limits and requests
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Health check probes (nginx)
  healthChecks:
    enabled: true
    liveness:
      path: /
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 10

# Application configuration (non-secret)
config:
  # Nginx configuration
  NGINX_PORT: "80"

# Secrets configuration (AWS Secrets Manager)
secrets:
  # Leave empty - frontend doesn't need database secrets
  data: []