# Default values for rttm service
# This chart deploys the PMS RTTM (Real-Time Trade Monitoring) microservice

# Service configuration
service:
  name: rttm
  namespace: pms
  port: 8087
  targetPort: 8087
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: sureshvasantha/pms-rttm
    tag: latest
    pullPolicy: Always

  # Resource limits and requests
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Health check probes
  healthChecks:
    enabled: true
    liveness:
      path: /actuator/health
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /actuator/health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  # Generic wait image for init containers
  waitImage: &waitImage "busybox:1.36"

  # Dependencies list - data-driven approach for init containers
  dependencies:
    - name: rds-postgres
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z pms-db-instance-green.cluster-cvk4yqey0ex7.us-east-2.rds.amazonaws.com 5432; do echo waiting for RDS postgres; sleep 2; done"
    - name: redis
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z redis-sentinel 26379; do echo waiting for redis sentinel; sleep 2; done"
    - name: kafka
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"

# Application configuration (non-secret)
config:
  # Database configuration - RTTM uses DB_URL format
  DB_URL: "jdbc:postgresql://postgres:5432/pmsdb"

  # Database JPA configuration
  # DB_DDL_AUTO: "update"
  DB_SHOW_SQL: "false"
  DB_JDBC_BATCH_SIZE: "1000"

  # Kafka configuration
  KAFKA_BOOTSTRAP: "kafka:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  KAFKA_CONSUMER_GROUP_ID: "rttm-group"

  # Service-specific config
  SERVER_PORT: "8087"
  SPRING_PROFILES_ACTIVE: "prod"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_PMS_RTTM: "DEBUG"

  # RTTM batching and queue settings - OPTIMIZED to match transactional/analytics
  RTTM_BATCH_SIZE: "1000"
  RTTM_BATCH_POLL_MS: "500"
  RTTM_QUEUE_CAPACITY: "10000"
  RTTM_CONSUMER_CONCURRENCY: "3"
  RTTM_FETCH_MAX_WAIT_MS: "1000"

  # Kafka topic configurations
  KAFKA_TOPIC_DLQ_EVENTS: "rttm.dlq.events"
  KAFKA_TOPIC_ERROR_EVENTS: "rttm.error.events"
  KAFKA_TOPIC_QUEUE_METRICS: "rttm.queue.metrics"
  KAFKA_TOPIC_TRADE_EVENTS: "rttm.trade.events"
  KAFKA_TOPIC_INVALID_TRADES: "invalid-trades-topic"

  # RTTM queue metrics retention and aggregation - ENHANCED (7 days retention)
  RTTM_QUEUE_METRICS_RETENTION_HOURS: "168"
  RTTM_QUEUE_METRICS_CLEANUP_CRON: "0 0 2 * * ?"
  RTTM_QUEUE_METRICS_AGG_THRESHOLD: "0.15"
  RTTM_QUEUE_METRICS_MIN_INTERVAL: "10"
  RTTM_QUEUE_METRICS_CACHE_TTL_HOURS: "24"
  RTTM_QUEUE_METRICS_CACHE_CLEANUP_MS: "3600000"

  # RTTM alert generation thresholds
  RTTM_ALERT_EVAL_INTERVAL: "60000"
  RTTM_ALERT_AUTO_RESOLVE_INTERVAL: "300000"

  # Latency thresholds (milliseconds) - REALISTIC thresholds for high-throughput
  RTTM_ALERT_LATENCY_WARNING: "1000"
  RTTM_ALERT_LATENCY_CRITICAL: "3000"

  # Error rate thresholds (count in 5 minutes) - PRODUCTION-ready thresholds
  RTTM_ALERT_ERROR_RATE_WARNING: "5"
  RTTM_ALERT_ERROR_RATE_CRITICAL: "20"

  # DLQ count thresholds (count in 5 minutes) - PRODUCTION-ready thresholds
  RTTM_ALERT_DLQ_WARNING: "10"
  RTTM_ALERT_DLQ_CRITICAL: "50"

  # Queue depth thresholds - ALIGNED with queue capacity
  RTTM_ALERT_QUEUE_DEPTH_WARNING: "1000"
  RTTM_ALERT_QUEUE_DEPTH_CRITICAL: "5000"

  # TPS (transactions per second) thresholds - HIGH-PERFORMANCE thresholds
  RTTM_ALERT_TPS_WARNING: "10000"
  RTTM_ALERT_TPS_CRITICAL: "15000"

  # Redis configuration
  REDIS_TIMEOUT: "2000"

  # Database configuration
  DB_FORMAT_SQL: "true"

# Secrets configuration (AWS S=ecrets Manager)
# RTTM service doesn't need specific secrets - uses global DB credentials
secrets:
  # Leave empty - service uses global pms-global-secrets for DB credentials
  data: []
