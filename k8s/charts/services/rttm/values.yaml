# Default values for rttm service
# This chart deploys the PMS RTTM (Real-Time Trade Monitoring) microservice

# Service configuration
service:
  name: rttm
  namespace: pms
  port: 8087
  targetPort: 8087
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: niishantdev/pms-rttm
    tag: latest
    pullPolicy: Always

  # Resource limits and requests
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Health check probes
  healthChecks:
    enabled: true
    liveness:
      path: /actuator/health
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /actuator/health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  # Generic wait image for init containers
  waitImage: &waitImage "busybox:1.36"

  # Dependencies list - data-driven approach for init containers
  dependencies:
    - name: postgres
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"
    - name: redis
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z redis-sentinel 26379; do echo waiting for redis sentinel; sleep 2; done"
    - name: kafka
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"

# Application configuration (non-secret)
config:
  # Database configuration - RTTM uses DB_URL format
  DB_URL: "jdbc:postgresql://postgres:5432/pmsdb"

  # Database JPA configuration
  DB_DDL_AUTO: "update"
  DB_SHOW_SQL: "true"

  # Kafka configuration
  KAFKA_BOOTSTRAP: "kafka:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  KAFKA_CONSUMER_GROUP_ID: "rttm-group"

  # Service-specific config
  SERVER_PORT: "8087"
  SPRING_PROFILES_ACTIVE: "prod"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_PMS_RTTM: "DEBUG"

  # RTTM batching and queue settings
  RTTM_BATCH_SIZE: "100"
  RTTM_BATCH_POLL_MS: "2000"
  RTTM_QUEUE_CAPACITY: "10000"
  RTTM_CONSUMER_CONCURRENCY: "3"
  RTTM_FETCH_MAX_WAIT_MS: "3000"

# Secrets configuration (AWS S=ecrets Manager)
# RTTM service doesn't need specific secrets - uses global DB credentials
secrets:
  # Leave empty - service uses global pms-global-secrets for DB credentials
  data: []
