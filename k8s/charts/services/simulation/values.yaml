# Default values for simulation service
# This chart deploys the PMS Simulation microservice

# Service configuration
service:
  name: simulation
  namespace: pms
  port: 8090
  targetPort: 8090
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: niishantdev/pms-simulation
    tag: latest
    pullPolicy: Always

  # Rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Generic wait image for init containers
  waitImage: &waitImage "busybox:1.36"

  # Dependencies list - data-driven approach for init containers
  dependencies:
    - name: postgres
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"
    - name: rabbitmq
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z rabbitmq 5552; do echo waiting for rabbitmq stream; sleep 2; done"
    - name: auth
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z auth 8081; do echo waiting for auth service; sleep 2; done"

# Application configuration (non-secret)
config:
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_STREAM_PORT: "5552"
  RABBITMQ_STREAM_NAME: trade-stream
  SPRING_RABBITMQ_STREAM_HOST: rabbitmq
  SPRING_RABBITMQ_STREAM_PORT: "5552"
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5552"
  DB_HOST: postgres
  DB_NAME: pmsdb
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pmsdb
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SCHEMA_REGISTRY_URL: http://schema-registry:8081
  SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/simulation

  # Refresh interval
  refreshInterval: 1h

  # Secret key mappings
  data:
    - secretKey: SIMULATION_DB_PASSWORD
      remoteKey: SIMULATION_DB_PASSWORD
    - secretKey: SIMULATION_API_KEY
      remoteKey: SIMULATION_API_KEY
    - secretKey: SIMULATION_JWT_SECRET
      remoteKey: SIMULATION_JWT_SECRET
    - secretKey: SPRING_RABBITMQ_USERNAME
      remoteKey: SPRING_RABBITMQ_USERNAME
    - secretKey: SPRING_RABBITMQ_PASSWORD
      remoteKey: SPRING_RABBITMQ_PASSWORD
    - secretKey: SPRING_RABBITMQ_STREAM_USERNAME
      remoteKey: SPRING_RABBITMQ_USERNAME
    - secretKey: SPRING_RABBITMQ_STREAM_PASSWORD
      remoteKey: SPRING_RABBITMQ_PASSWORD
    - secretKey: SPRING_RABBITMQ_HOST
      remoteKey: SPRING_RABBITMQ_HOST
    - secretKey: SPRING_RABBITMQ_PORT
      remoteKey: SPRING_RABBITMQ_PORT
