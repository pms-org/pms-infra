# Default values for simulation service
# This chart deploys the PMS Simulation microservice

# Service configuration
service:
  name: simulation
  namespace: pms
  port: 8090
  targetPort: 8090
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: nehanawork1/pms-simulation
    tag: latest
    pullPolicy: Always

  # Rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # Resource limits and requests
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  # Health check probes
  healthChecks:
    enabled: false
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /actuator/health/liveness
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  # Generic wait image for init containers
  waitImage: &waitImage "busybox:1.36"

  # Stream cleanup configuration
  streamCleanup:
    enabled: false # Disabled by default, enable only for troubleshooting
    image: rabbitmq:3.13-management-alpine
    streamName: trade-stream

  # Dependencies list - data-driven approach for init containers
  dependencies:
    - name: postgres
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"
    - name: rabbitmq
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z rabbitmq 5552; do echo waiting for rabbitmq stream; sleep 2; done"
    - name: auth
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z auth 8081; do echo waiting for auth service; sleep 2; done"

# Application configuration (non-secret)
config:
  # Note: RABBITMQ_HOST, RABBITMQ_STREAM_PORT, RABBITMQ_STREAM_NAME
  # DB_HOST, DB_PORT, DB_NAME, KAFKA_BOOTSTRAP_SERVERS, SCHEMA_REGISTRY_URL
  # All come from global config in pms-platform
  SERVER_PORT: "8090"
  # DB_DDL_AUTO: "update"
  DB_SHOW_SQL: "false"
  DB_FORMAT_SQL: "true"
  JPA_OPEN_IN_VIEW: "false"

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/simulation

  # Refresh interval
  refreshInterval: 1h

  # Service-specific secret key mappings (Global secrets come from pms-global-secrets)
  data:
    - secretKey: SIMULATION_API_KEY
      remoteKey: SIMULATION_API_KEY
    - secretKey: SIMULATION_JWT_SECRET
      remoteKey: SIMULATION_JWT_SECRET
