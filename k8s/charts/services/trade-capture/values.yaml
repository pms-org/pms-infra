# Default values for trade-capture service
# This chart deploys the PMS Trade Capture microservice

# Service configuration
service:
  name: trade-capture
  namespace: pms
  port: 8082
  targetPort: 8082
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: niishantdev/pms-trade-capture
    tag: latest
    pullPolicy: Always

  # Rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # Resource limits and requests
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Health check probes
  healthChecks:
    enabled: true # ENABLED: Critical - validation service depends on trade-capture being ready
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /actuator/health/liveness
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  # Generic wait image for init containers
  waitImage: &waitImage "busybox:1.36"

  # Dependencies list - data-driven approach for init containers
  dependencies:
    - name: rds-postgres
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z pms-db-instance-green.cluster-cvk4yqey0ex7.us-east-2.rds.amazonaws.com 5432; do echo waiting for RDS postgres; sleep 2; done"
    - name: rabbitmq
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z rabbitmq 5552; do echo waiting for rabbitmq stream; sleep 2; done"
    - name: simulation
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z simulation 8090; do echo waiting for simulation service; sleep 2; done"
    - name: kafka
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z kafka 19092; do echo waiting for kafka; sleep 2; done"
    - name: schema-registry
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z schema-registry 8081; do echo waiting for schema-registry; sleep 2; done"

# Application configuration (non-secret)
config:
  # Note: DB_HOST, DB_PORT, DB_NAME, RABBITMQ_HOST, RABBITMQ_STREAM_PORT,
  # RABBITMQ_STREAM_NAME, KAFKA_BOOTSTRAP_SERVERS, SCHEMA_REGISTRY_URL
  # All come from global config in pms-platform

  # Service-specific config
  SERVER_PORT: "8082"
  SPRING_PROFILES_ACTIVE: docker
  TRADE_CAPTURE_POOL_SIZE: "20"
  JPA_OPEN_IN_VIEW: "false"
  TRADE_CAPTURE_BATCH_SIZE: "500"
  TRADE_CAPTURE_BATCH_TIMEOUT_MS: "100"
  TRADE_CAPTURE_CONSUMER_GROUP: trade-capture-group
  ORDER_INSERTS: "true"
  ORDER_UPDATES: "true"
  INGEST_BATCH_MAX_SIZE: "500"
  INGEST_BATCH_FLUSH_INTERVAL: "100"
  OUTBOX_MAX_RETRIES: "3"
  OUTBOX_TARGET_LATENCY: "200"
  OUTBOX_MIN_BATCH: "10"
  OUTBOX_MAX_BATCH: "2000"
  OUTBOX_POLL_INTERVAL: "100"
  OUTBOX_BATCH_SIZE: "200"
  OUTBOX_CONCURRENCY: "4"

  # RTTM Client Configuration
  RTTM_MODE: kafka
  KAFKA_TOPIC_TRADE_EVENTS: rttm.trade.events
  KAFKA_TOPIC_DLQ_EVENTS: rttm.dlq.events
  KAFKA_TOPIC_QUEUE_METRICS: rttm.queue.metrics
  KAFKA_TOPIC_ERROR_EVENTS: rttm.error.events
  RTTM_SEND_TIMEOUT_MS: "3000"
  RTTM_RETRY_MAX_ATTEMPTS: "3"
  RTTM_RETRY_BACKOFF_MS: "100"
  RTTM_METRICS_INTERVAL_MS: "30000"

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/trade-capture

  # Refresh interval
  refreshInterval: 1h

  # Service-specific secret key mappings (Global secrets come from pms-global-secrets)
  data:
    - secretKey: TRADE_CAPTURE_API_KEY
      remoteKey: TRADE_CAPTURE_API_KEY
    - secretKey: TRADE_CAPTURE_JWT_SECRET
      remoteKey: TRADE_CAPTURE_JWT_SECRET
