# Default values for trade-capture service
# This chart deploys the PMS Trade Capture microservice

# Service configuration
service:
  name: trade-capture
  namespace: pms
  port: 8082
  targetPort: 8082
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: niishantdev/pms-trade-capture
    tag: latest
    pullPolicy: IfNotPresent

  # Rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # Resource limits and requests
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Init containers for dependency checking
  initContainers:
    postgres:
      enabled: true
      image: busybox:1.36
      command:
        [
          "sh",
          "-c",
          "until /bin/nc -z postgres 5432; do echo waiting for postgres; sleep 2; done",
        ]
    rabbitmq:
      enabled: true
      image: busybox:1.36
      command:
        [
          "sh",
          "-c",
          "until /bin/nc -z rabbitmq 5552; do echo waiting for rabbitmq stream; sleep 2; done",
        ]
    kafka:
      enabled: true
      image: busybox:1.36
      command:
        [
          "sh",
          "-c",
          "until /bin/nc -z kafka 19092; do echo waiting for kafka; sleep 2; done",
        ]
    schemaRegistry:
      enabled: true
      image: busybox:1.36
      command:
        [
          "sh",
          "-c",
          "until /bin/nc -z schema-registry 8081; do echo waiting for schema-registry; sleep 2; done",
        ]

# Application configuration (non-secret)
config:
  SPRING_PROFILES_ACTIVE: docker
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pmsdb
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5672"
  DB_HOST: postgres
  DB_NAME: pmsdb
  DATASOURCE_HIKARI_POOL_SIZE: "20"
  JPA_OPEN_IN_VIEW: "false"
  JDBC_BATCH_SIZE: "500"
  APP_RABBIT_STREAM_HOST: rabbitmq
  APP_RABBIT_STREAM_PORT: "5552"
  APP_RABBIT_STREAM_NAME: trade-stream
  APP_RABBIT_STREAM_CONSUMER_NAME: trade-capture-group
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SCHEMA_REGISTRY_URL: http://schema-registry:8081
  SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
  SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer
  SPRING_KAFKA_PRODUCER_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081
  SPRING_KAFKA_PRODUCER_PROPERTIES_AUTO_REGISTER_SCHEMAS: "true"
  BATCH_SIZE: "500"
  BATCH_TIMEOUT_MS: "100"

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/trade-capture

  # Refresh interval
  refreshInterval: 1h

  # Secret key mappings
  data:
    - secretKey: TRADE_CAPTURE_DB_PASSWORD
      remoteKey: TRADE_CAPTURE_DB_PASSWORD
    - secretKey: TRADE_CAPTURE_API_KEY
      remoteKey: TRADE_CAPTURE_API_KEY
    - secretKey: TRADE_CAPTURE_JWT_SECRET
      remoteKey: TRADE_CAPTURE_JWT_SECRET
    - secretKey: SPRING_RABBITMQ_USERNAME
      remoteKey: SPRING_RABBITMQ_USERNAME
    - secretKey: SPRING_RABBITMQ_PASSWORD
      remoteKey: SPRING_RABBITMQ_PASSWORD
    - secretKey: APP_RABBIT_STREAM_USERNAME
      remoteKey: SPRING_RABBITMQ_USERNAME
    - secretKey: APP_RABBIT_STREAM_PASSWORD
      remoteKey: SPRING_RABBITMQ_PASSWORD
