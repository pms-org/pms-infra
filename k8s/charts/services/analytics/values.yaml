# Default values for analytics service
# This chart deploys the PMS analytics microservice

# Service configuration
service:
  name: analytics
  namespace: pms
  port: 8086
  targetPort: 8086
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: sboomisnow/pms-analytics-app
    tag: latest
    pullPolicy: Always

  # Resource limits and requests
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  # Health check probes
  healthChecks:
    enabled: false
    liveness:
      path: /actuator/health
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /actuator/health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  # Generic wait image for init containers
  waitImage: &waitImage "busybox:1.36"

  # Dependencies list - data-driven approach for init containers
  dependencies:
    - name: postgres
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"
    - name: redis
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"
    - name: kafka
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z kafka 19092; do echo waiting for kafka; sleep 2; done"
    - name: schema-registry
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z schema-registry 8081; do echo waiting for schema-registry; sleep 2; done"
    - name: transactional
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z transactional 8084; do echo waiting for transactional; sleep 2; done"

# Application configuration (non-secret)
config:
  # Note: DB_HOST, DB_PORT, DB_NAME, REDIS_HOST, REDIS_PORT come from global config in pms-platform

  # Database configuration
  # DB_DDL_AUTO: "update"
  DB_SHOW_SQL: "false"
  DB_JDBC_BATCH_SIZE: "50"

  # Service-specific config
  # Redis Sentinel configuration
  # Spring Boot expects SPRING_DATA_REDIS_* environment variables
  # which automatically map to spring.data.redis.* properties
  # These are populated from global.config values in the deployment template
  ANALYTICS_REDIS_TIMEOUT: "10000" # milliseconds (10s)
  ANALYTICS_REDIS_SHUTDOWN_TIMEOUT: "2000" # milliseconds (2s)
  ANALYTICS_REDIS_SENTINEL_MASTER: "pms-redis"
  ANALYTICS_REDIS_SENTINEL_NODES: "redis-sentinel:26379"
  ANALYTICS_SERVER_PORT: "8086"
  ANALYTICS_PROFILES_ACTIVE: "prod"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_PMS: "DEBUG"

  # Kafka configuration
  ANALYTICS_KAFKA_CONSUMER_GROUP_ID: "analytics-group"
  ANALYTICS_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: "false"
  ANALYTICS_KAFKA_CONSUMER_TOPIC: "transactional-trades-topic"
  ANALYTICS_KAFKA_PRODUCER_TOPIC: "analytics-trades-topic"
  ANALYTICS_KAFKA_SEND_TIMEOUT_MS: "60000"
  ANALYTICS_KAFKA_CONSUMER_ID: "analytics-consumer"

  # Buffer configuration
  ANALYTICS_BUFFER_SIZE: "1000"
  ANALYTICS_FLUSH_INTERVAL_MS: "5000"

  # Finnhub API configuration
  FINNHUB_API_BASE_URL: "https://finnhub.io/api/v1"

  # App-specific Redis keys
  ANALYTICS_REDIS_PRICE_KEY: "stock:prices"
  ANALYTICS_REDIS_TRANSACTION_KEY: "transactions"

  # Scheduler configuration
  ANALYTICS_PORTFOLIO_VALUE_CRON: "0 59 23 * * ?" # Daily at 23:59 (app.properties value)
  ANALYTICS_PORTFOLIO_VALUE_TIMEZONE: "Asia/Kolkata" # Changed from UTC to match app.properties
  ANALYTICS_PRICE_REFRESH_DELAY_MS: "30000" # 30 seconds (was 3000ms)

  # Outbox configuration
  ANALYTICS_OUTBOX_SYSTEM_FAILURE_DELAY_MS: "2000" # Changed from 10000 to match app.properties
  ANALYTICS_OUTBOX_EMPTY_DELAY_MS: "5000"
  ANALYTICS_OUTBOX_EXCEPTION_DELAY_MS: "1000" # Changed from 30000 to match app.properties
  ANALYTICS_OUTBOX_RETRY_ATTEMPTS: "3"

  # Database health check
  ANALYTICS_DB_HEALTH_CHECK_RETRY_MS: "5000"

  # Risk calculation
  ANALYTICS_RISK_DECIMAL_SCALE: "8" # Changed from 4 to match app.properties
  ANALYTICS_RISK_MATH_PRECISION: "10" # Changed from 32 to match app.properties

  # WebSocket topics
  ANALYTICS_WS_TOPIC_POSITION_UPDATE: "/topic/position-update"
  ANALYTICS_WS_TOPIC_UNREALIZED_PNL: "/topic/unrealized-pnl"

  # CORS configuration
  ANALYTICS_CORS_ALLOWED_ORIGINS: "http://localhost:4200"
  ANALYTICS_CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/analytics

  # Refresh interval
  refreshInterval: 1h

  # Secret key mappings
  data:
    - secretKey: FINNHUB_API_KEY
      remoteKey: FINNHUB_API_KEY
