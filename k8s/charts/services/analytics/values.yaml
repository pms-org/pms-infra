# Default values for analytics service
# This chart deploys the PMS analytics microservice

# Service configuration
service:
  name: analytics
  namespace: pms
  port: 8086
  targetPort: 8086
  type: ClusterIP

# Deployment configuration
deployment:
  replicas: 1
  image:
    repository: niishantdev/pms-analytics
    tag: latest
    pullPolicy: Always

  # Resource limits and requests
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  # Health check probes
  healthChecks:
    enabled: false
    liveness:
      path: /actuator/health
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /actuator/health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  # Generic wait image for init containers
  waitImage: &waitImage "busybox:1.36"

  # Dependencies list - data-driven approach for init containers
  dependencies:
    - name: postgres
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"
    - name: redis
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"
    - name: kafka
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z kafka 19092; do echo waiting for kafka; sleep 2; done"
    - name: schema-registry
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z schema-registry 8081; do echo waiting for schema-registry; sleep 2; done"
    - name: transactional
      enabled: true
      image: *waitImage
      command:
        - sh
        - -c
        - "until nc -z transactional 8084; do echo waiting for transactional; sleep 2; done"

# Application configuration (non-secret)
config:
  # Note: DB_HOST, DB_PORT, DB_NAME, REDIS_HOST, REDIS_PORT come from global config in pms-platform

  # Database configuration
  DB_DDL_AUTO: "update"
  DB_SHOW_SQL: "false"

  # Service-specific config
  ANALYTICS_SERVER_PORT: "8086"
  SPRING_PROFILES_ACTIVE: "prod"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_PMS: "DEBUG"

  # Kafka configuration
  ANALYTICS_KAFKA_CONSUMER_GROUP_ID: "analytics-group"
  ANALYTICS_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: "false"
  ANALYTICS_KAFKA_TOPIC: "transactional-trades-topic"

# Secrets configuration (AWS Secrets Manager)
secrets:
  # AWS Secrets Manager secret path
  path: pms/dev/analytics

  # Refresh interval
  refreshInterval: 1h

  # Secret key mappings
  data:
    - secretKey: FINNHUB_API_KEY
      remoteKey: FINNHUB_API_KEY
