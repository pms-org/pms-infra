apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: "{{ .Values.aws.region }}"
      auth:
        jwt:
          serviceAccountRef:
            name: "{{ .Values.aws.irsa.serviceAccountName }}"
            namespace: "{{ .Values.namespace }}"
