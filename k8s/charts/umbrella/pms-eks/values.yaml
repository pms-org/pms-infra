# PMS EKS Umbrella Chart Values
# This file contains global configuration and wiring for all PMS components

# Global settings
global:
  # Environment settings
  environment: dev
  namespace: pms

  # AWS configuration
  aws:
    region: us-east-1
    accountId: "123456789012"
    clusterName: "pms-dev-cluster"

  # Service discovery and networking
  services:
    postgres:
      host: postgres
      port: 5432
      database: pmsdb
    rabbitmq:
      host: rabbitmq
      amqpPort: 5672
      streamPort: 5552
      streamName: trade-stream
    kafka:
      host: kafka
      port: 9092
      internalPort: 19092
    schemaRegistry:
      host: schema-registry
      port: 8081
    redis:
      host: redis
      port: 6379
    apigateway:
      host: apigateway
      port: 8080
    auth:
      host: auth
      port: 8081
    simulation:
      host: simulation
      port: 8083
    tradeCapture:
      host: trade-capture
      port: 8082
    validation:
      host: validation
      port: 8084

  # Feature toggles - enable/disable components
  postgres:
    enabled: true
  kafka:
    enabled: true
  rabbitmq:
    enabled: true
  redis:
    enabled: true
  schemaRegistry:
    enabled: true
  externalSecrets:
    enabled: true
  apigateway:
    enabled: true
  auth:
    enabled: true
  simulation:
    enabled: true
  tradeCapture:
    enabled: true
  validation:
    enabled: true

# Infrastructure component configurations
postgres:
  # Custom postgres chart values
  service:
    port: 5432
  auth:
    database: pmsdb

kafka:
  # Custom kafka chart values
  service:
    ports:
      internal: 9092
      external: 19092

rabbitmq:
  # Custom rabbitmq chart values
  service:
    ports:
      amqp: 5672
      stream: 5552
  stream:
    name: trade-stream

redis:
  # Custom redis chart values
  master:
    port: 6379

schema-registry:
  # Custom schema-registry chart values
  service:
    port: 8081

# Platform component configurations
external-secrets:
  # Custom external-secrets chart values
  aws:
    region: us-east-1
    irsa:
      roleArn: "arn:aws:iam::123456789012:role/pms-dev-cluster-external-secrets"

# Service component configurations
apigateway:
  # Service-specific overrides
  service:
    port: 8080
  config:
    # Use global service discovery
    AUTH_SERVICE_URL: "http://{{ .Values.global.services.auth.host }}:{{ .Values.global.services.auth.port }}"
    TRADE_CAPTURE_URL: "http://{{ .Values.global.services.tradeCapture.host }}:{{ .Values.global.services.tradeCapture.port }}"

auth:
  service:
    port: 8081
  config:
    DB_HOST: "{{ .Values.global.services.postgres.host }}"
    DB_PORT: "{{ .Values.global.services.postgres.port }}"
    DB_NAME: "{{ .Values.global.services.postgres.database }}"

simulation:
  service:
    port: 8083
  config:
    DB_HOST: "{{ .Values.global.services.postgres.host }}"
    KAFKA_BOOTSTRAP_SERVERS: "{{ .Values.global.services.kafka.host }}:{{ .Values.global.services.kafka.port }}"

trade-capture:
  service:
    port: 8082
  config:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ .Values.global.services.postgres.host }}:{{ .Values.global.services.postgres.port }}/{{ .Values.global.services.postgres.database }}"
    SPRING_RABBITMQ_HOST: "{{ .Values.global.services.rabbitmq.host }}"
    SPRING_RABBITMQ_PORT: "{{ .Values.global.services.rabbitmq.amqpPort }}"
    APP_RABBIT_STREAM_HOST: "{{ .Values.global.services.rabbitmq.host }}"
    APP_RABBIT_STREAM_PORT: "{{ .Values.global.services.rabbitmq.streamPort }}"
    APP_RABBIT_STREAM_NAME: "{{ .Values.global.services.rabbitmq.streamName }}"
    SPRING_KAFKA_BOOTSTRAP_SERVERS: "{{ .Values.global.services.kafka.host }}:{{ .Values.global.services.kafka.port }}"
    SCHEMA_REGISTRY_URL: "http://{{ .Values.global.services.schemaRegistry.host }}:{{ .Values.global.services.schemaRegistry.port }}"
  secrets:
    path: pms/{{ .Values.global.environment }}/trade-capture

validation:
  service:
    port: 8084
  config:
    DB_HOST: "{{ .Values.global.services.postgres.host }}"
    KAFKA_BOOTSTRAP_SERVERS: "{{ .Values.global.services.kafka.host }}:{{ .Values.global.services.kafka.port }}"
    SCHEMA_REGISTRY_URL: "http://{{ .Values.global.services.schemaRegistry.host }}:{{ .Values.global.services.schemaRegistry.port }}"
  secrets:
    path: pms/{{ .Values.global.environment }}/validation
