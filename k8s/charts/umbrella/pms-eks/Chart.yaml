apiVersion: v2
name: pms-eks
description: PMS EKS Umbrella Chart - Consolidated deployment for all PMS services and infrastructure
type: application
version: 0.1.0
appVersion: "1.0"

keywords:
  - pms
  - umbrella
  - eks
  - kubernetes

maintainers:
  - name: Platform Team

dependencies:
  # Infrastructure dependencies (custom charts)
  - name: postgres
    version: "0.1.0"
    repository: "file://../../infra/postgres"
    condition: global.postgres.enabled
  - name: kafka
    version: "0.1.0"
    repository: "file://../../infra/kafka"
    condition: global.kafka.enabled
  - name: rabbitmq
    version: "0.1.0"
    repository: "file://../../infra/rabbitmq"
    condition: global.rabbitmq.enabled
  - name: redis
    version: "0.1.0"
    repository: "file://../../infra/redis"
    condition: global.redis.enabled
  - name: schema-registry
    version: "0.1.0"
    repository: "file://../../infra/schema-registry"
    condition: global.schemaRegistry.enabled

  # Platform dependencies
  - name: external-secrets
    version: "0.1.0"
    repository: "file://../../platform/external-secrets"
    condition: global.externalSecrets.enabled

  # Service dependencies
  - name: apigateway
    version: "0.1.0"
    repository: "file://../../services/apigateway"
    condition: global.apigateway.enabled
  - name: auth
    version: "0.1.0"
    repository: "file://../../services/auth"
    condition: global.auth.enabled
  - name: simulation
    version: "0.1.0"
    repository: "file://../../services/simulation"
    condition: global.simulation.enabled
  - name: trade-capture
    version: "0.1.0"
    repository: "file://../../services/trade-capture"
    condition: global.tradeCapture.enabled
  - name: validation
    version: "0.1.0"
    repository: "file://../../services/validation"
    condition: global.validation.enabled
