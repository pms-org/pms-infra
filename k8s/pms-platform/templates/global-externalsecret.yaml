{{- if .Values.global.secrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pms-global-secrets
  namespace: {{ .Values.global.namespace | default "pms" }}
spec:
  # Refresh secrets every configured interval
  refreshInterval: {{ .Values.global.secrets.refreshInterval | default "1h" }}

  # Reference the cluster-wide SecretStore
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  # Target Kubernetes secret to create
  target:
    name: pms-global-secrets
    creationPolicy: Owner

  # Map AWS Secrets Manager keys to Kubernetes secret keys
  data:
  # Database credentials
  - secretKey: DB_USERNAME
    remoteRef:
      key: pms/{{ .Values.global.environment }}/database
      property: DB_USERNAME
  - secretKey: DB_PASSWORD
    remoteRef:
      key: pms/{{ .Values.global.environment }}/database
      property: DB_PASSWORD

  # RabbitMQ credentials
  - secretKey: RABBITMQ_USERNAME
    remoteRef:
      key: pms/{{ .Values.global.environment }}/rabbitmq
      property: RABBITMQ_USERNAME
  - secretKey: RABBITMQ_PASSWORD
    remoteRef:
      key: pms/{{ .Values.global.environment }}/rabbitmq
      property: RABBITMQ_PASSWORD

  # Redis credentials
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: pms/{{ .Values.global.environment }}/redis
      property: REDIS_PASSWORD
{{- end }}
