# pms-platform/values.yaml

# Global toggles
postgres:
  enabled: true
rabbitmq:
  enabled: true
redis:
  enabled: true
kafka:
  enabled: true
schemaRegistry:
  enabled: true
externalSecrets:
  enabled: false

apigateway:
  enabled: true
auth:
  enabled: true
simulation:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
tradeCapture:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
validation:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
transactional:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
analytics:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
leaderboard:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
portfolio:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
rttm:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
frontend:
  enabled: true
  deployment:
    healthChecks:
      enabled: false

# Optional shared values
global:
  environment: dev
  namespace: pms

  # Global configuration (non-secret values shared across services)
  config:
    # Database
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: pmsdb
    DB_DRIVER: org.postgresql.Driver
    DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    DB_DDL_AUTO: update
    DB_SHOW_SQL: "false"
    DB_FORMAT_SQL: "true"
    JPA_OPEN_IN_VIEW: "false"

    # Redis with Sentinel
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_SENTINEL_HOST: redis-sentinel
    REDIS_SENTINEL_PORT: "26379"
    REDIS_SENTINEL_MASTER: pms-redis
    REDIS_TIMEOUT: 2s
    CACHE_TYPE: redis

    # RabbitMQ
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    RABBITMQ_STREAM_PORT: "5552"
    RABBITMQ_STREAM_NAME: trade-stream

    # Kafka
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    KAFKA_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
    KAFKA_VALUE_SERIALIZER: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer
    KAFKA_AUTO_REGISTER_SCHEMAS: "true"

    # Service Discovery
    AUTH_SERVICE_HOST: auth
    AUTH_SERVICE_PORT: "8081"
    SIMULATION_SERVICE_HOST: pms-simulation
    SIMULATION_SERVICE_PORT: "8090"
    PORTFOLIO_SERVICE_HOST: portfolio
    PORTFOLIO_SERVICE_PORT: "8095"
    TRADE_CAPTURE_SERVICE_HOST: trade-capture
    TRADE_CAPTURE_SERVICE_PORT: "8082"
    VALIDATION_SERVICE_HOST: validation-service
    VALIDATION_SERVICE_PORT: "8080"

    # Topics
    INCOMING_TRADES_TOPIC: raw-trades-topic
    OUTGOING_VALID_TRADES_TOPIC: valid-trades-topic
    OUTGOING_INVALID_TRADES_TOPIC: invalid-trades-topic

    #Transactional Service
    TRANSACTIONAL_JDBC_BATCH_SIZE: 500
    TRANSACTIONAL_SERVER_PORT: 8084
    TRANSACTIONAL_BUFFER_SIZE: 150000
    TRANSACTIONAL_OUTBOX_TARGET_LATENCY_MS: 200
    TRANSACTIONAL_OUTBOX_BATCH_MIN: 200
    TRANSACTIONAL_OUTBOX_BATCH_MAX: 500
    TRANSACTIONAL_OUTBOX_BATCH_SIZE: 500
    TRANSACTIONAL_FLUSH_INTERVAL_MS: 1000
    TRANSACTIONAL_TRANSACTIONS_PUBLISHING_TOPIC: transactional-trades-topic
    TRANSACTIONAL_TRANSACTIONS_CONSUMER_GROUP_ID: transactional-trades-consumer-group
    TRANSACTIONAL_TRADES_CONSUMER_LISTENING_TOPIC: valid-trades-topic
    TRANSACTIONAL_TRADES_CONSUMER_GROUP_ID: transactional-validation-consumer-group

  # Global secrets configuration
  secrets:
    enabled: true
    refreshInterval: 1h
