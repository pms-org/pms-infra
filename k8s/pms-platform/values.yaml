# pms-platform/values.yaml

# Global toggles
postgres:
  enabled: false  # DISABLED - RDS ONLY (AUTHORITATIVE)
rabbitmq:
  enabled: true
redis:
  enabled: true
kafka:
  enabled: true
schemaRegistry:
  enabled: true
pgadmin:
  enabled: false  # Enable in dev environment
externalSecrets:
  enabled: false
seedData:
  enabled: false
pmsIngress:
  enabled: true

# Ingress configuration
# The pms-ingress chart will create an ALB and route traffic to frontend and apigateway
pms-ingress:
  namespace: pms
  ingressClassName: alb
  host: ""  # Empty = accept all hosts (ALB DNS works directly)
  
  # Keep TLS disabled initially - enable after adding ACM certificate
  tls:
    enabled: false
  
  routes:
    frontend:
      enabled: true
    api:
      enabled: true
    websocket:
      enabled: true

apigateway:
  enabled: true
  service:
    type: ClusterIP  # Changed to ClusterIP - accessible via ingress only
    annotations:
      alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
      alb.ingress.kubernetes.io/healthcheck-port: "8088"
      alb.ingress.kubernetes.io/success-codes: "200-299"
  deployment:
    healthChecks:
      enabled: false
auth:
  enabled: true
simulation:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
tradeCapture:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
validation:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
transactional:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
analytics:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
  config:
    # Analytics needs longer timeout for Redis operations
    ANALYTICS_REDIS_TIMEOUT: "10000"  # milliseconds
    ANALYTICS_REDIS_SHUTDOWN_TIMEOUT: "2000"  # milliseconds
leaderboard:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
portfolio:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
rttm:
  enabled: true
  deployment:
    healthChecks:
      enabled: false
frontend:
  enabled: true
  service:
    type: ClusterIP  # Changed to ClusterIP - accessible via ingress only
  deployment:
    healthChecks:
      enabled: false
  # Runtime configuration for frontend
  # Override these values per environment using k8s/environments/{env}/values.yaml
  # INGRESS MODE: All traffic goes through ALB (same-origin, no CORS)
  runtimeConfig:
    # API Gateway through ALB - Same origin as frontend!
    # ALB routes /api/* and /ws/* to API Gateway internally
    # NOTE: Use http:// for WebSocket URLs - SockJS will upgrade to ws:// internally
    API_GATEWAY_HTTP: "http://k8s-pms-pmsingre-ba04040d46-1336522306.us-east-1.elb.amazonaws.com"
    API_GATEWAY_WS: "http://k8s-pms-pmsingre-ba04040d46-1336522306.us-east-1.elb.amazonaws.com"
    
    # All services route through API Gateway (single entry point)
    AUTH_HTTP: "http://k8s-pms-pmsingre-ba04040d46-1336522306.us-east-1.elb.amazonaws.com"
    PORTFOLIO_HTTP: "http://k8s-pms-pmsingre-ba04040d46-1336522306.us-east-1.elb.amazonaws.com"
    PORTFOLIO_WS: "http://k8s-pms-pmsingre-ba04040d46-1336522306.us-east-1.elb.amazonaws.com"
    ANALYTICS_HTTP: "http://k8s-pms-pmsingre-ba04040d46-1336522306.us-east-1.elb.amazonaws.com"
    ANALYTICS_WS: "http://k8s-pms-pmsingre-ba04040d46-1336522306.us-east-1.elb.amazonaws.com"
    LEADERBOARD_HTTP: "http://k8s-pms-pmsingre-ba04040d46-1336522306.us-east-1.elb.amazonaws.com"
    LEADERBOARD_WS: "http://k8s-pms-pmsingre-ba04040d46-1336522306.us-east-1.elb.amazonaws.com"
    RTTM_HTTP: "http://k8s-pms-pmsingre-ba04040d46-1336522306.us-east-1.elb.amazonaws.com"
    RTTM_WS: "http://k8s-pms-pmsingre-ba04040d46-1336522306.us-east-1.elb.amazonaws.com"# Optional shared values
global:
  environment: dev
  namespace: pms

  # Global configuration (non-secret values shared across services)
  config:
    # Database - RDS ONLY (AUTHORITATIVE)
    DB_HOST: pms-dev-postgres.cab8eqka4smp.us-east-1.rds.amazonaws.com
    DB_PORT: "5432"
    DB_NAME: pmsdb
    DB_URL: jdbc:postgresql://pms-dev-postgres.cab8eqka4smp.us-east-1.rds.amazonaws.com:5432/pmsdb
    SPRING_DATASOURCE_URL: jdbc:postgresql://pms-dev-postgres.cab8eqka4smp.us-east-1.rds.amazonaws.com:5432/pmsdb
    DB_DRIVER: org.postgresql.Driver
    DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    DB_DDL_AUTO: update
    DB_SHOW_SQL: "false"
    DB_FORMAT_SQL: "true"
    JPA_OPEN_IN_VIEW: "false"

    # Redis with Sentinel
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_SENTINEL_HOST: redis-sentinel
    REDIS_SENTINEL_PORT: "26379"
    REDIS_SENTINEL_MASTER: pms-redis
    REDIS_TIMEOUT: 2s
    CACHE_TYPE: redis

    # RabbitMQ
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    RABBITMQ_STREAM_PORT: "5552"
    RABBITMQ_STREAM_NAME: trade-stream

    # Kafka
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    KAFKA_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
    KAFKA_VALUE_SERIALIZER: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer
    KAFKA_AUTO_REGISTER_SCHEMAS: "true"

    # Service Discovery
    AUTH_SERVICE_HOST: auth
    AUTH_SERVICE_PORT: "8081"
    SIMULATION_SERVICE_HOST: pms-simulation
    SIMULATION_SERVICE_PORT: "8090"
    PORTFOLIO_SERVICE_HOST: portfolio
    PORTFOLIO_SERVICE_PORT: "8095"
    TRADE_CAPTURE_SERVICE_HOST: trade-capture
    TRADE_CAPTURE_SERVICE_PORT: "8082"
    VALIDATION_SERVICE_HOST: validation-service
    VALIDATION_SERVICE_PORT: "8080"

    # Topics
    INCOMING_TRADES_TOPIC: raw-trades-topic
    OUTGOING_VALID_TRADES_TOPIC: valid-trades-topic
    OUTGOING_INVALID_TRADES_TOPIC: invalid-trades-topic

    #Transactional Service
    TRANSACTIONAL_JDBC_BATCH_SIZE: 500
    TRANSACTIONAL_SERVER_PORT: 8084
    TRANSACTIONAL_BUFFER_SIZE: 150000
    TRANSACTIONAL_OUTBOX_TARGET_LATENCY_MS: 200
    TRANSACTIONAL_OUTBOX_BATCH_MIN: 200
    TRANSACTIONAL_OUTBOX_BATCH_MAX: 500
    TRANSACTIONAL_OUTBOX_BATCH_SIZE: 500
    TRANSACTIONAL_FLUSH_INTERVAL_MS: 1000
    TRANSACTIONAL_TRANSACTIONS_PUBLISHING_TOPIC: transactional-trades-topic
    TRANSACTIONAL_TRANSACTIONS_CONSUMER_GROUP_ID: transactional-trades-consumer-group
    TRANSACTIONAL_TRADES_CONSUMER_LISTENING_TOPIC: valid-trades-topic
    TRANSACTIONAL_TRADES_CONSUMER_GROUP_ID: transactional-validation-consumer-group

    # Analytics Service
    ANALYTICS_PROFILES_ACTIVE: dev
    ANALYTICS_SERVER_PORT: "8082"
    ANALYTICS_REDIS_TIMEOUT: 10s
    ANALYTICS_REDIS_SHUTDOWN_TIMEOUT: 2s
    ANALYTICS_REDIS_SENTINEL_MASTER: pms-redis
    ANALYTICS_REDIS_SENTINEL_NODES: redis-sentinel:26379
    ANALYTICS_KAFKA_CONSUMER_GROUP_ID: analytics-group
    ANALYTICS_KAFKA_SEND_TIMEOUT_MS: "30000"
    DB_JDBC_BATCH_SIZE: "50"
    FINNHUB_API_KEY: "your-api-key-here"
    FINNHUB_API_BASE_URL: "https://finnhub.io/api/v1"

  # Global secrets configuration
  secrets:
    enabled: true
    refreshInterval: 1h
