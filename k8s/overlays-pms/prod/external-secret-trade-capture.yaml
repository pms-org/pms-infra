# ExternalSecret for trade-capture service credentials
# Fetches credentials from AWS Secrets Manager and creates a K8s Secret
#
# WHY: Eliminates hardcoded credentials, pulls from AWS Secrets Manager
# FLOW: AWS Secrets Manager → External Secrets Operator → K8s Secret → Pod env vars

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: trade-capture-secrets
  namespace: pms
spec:
  refreshInterval: 1h  # How often to sync from AWS

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: trade-capture-secrets  # Name of the K8s secret to create
    creationPolicy: Owner

  data:
    # Database credentials
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: pms/prod/database
        property: username

    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: pms/prod/database
        property: password

    - secretKey: DATASOURCE_USER
      remoteRef:
        key: pms/prod/database
        property: username

    - secretKey: DATASOURCE_PASS
      remoteRef:
        key: pms/prod/database
        property: password

    # RabbitMQ credentials
    - secretKey: SPRING_RABBITMQ_USERNAME
      remoteRef:
        key: pms/prod/rabbitmq
        property: username

    - secretKey: SPRING_RABBITMQ_PASSWORD
      remoteRef:
        key: pms/prod/rabbitmq
        property: password

    - secretKey: APP_RABBIT_STREAM_USERNAME
      remoteRef:
        key: pms/prod/rabbitmq
        property: username

    - secretKey: APP_RABBIT_STREAM_PASSWORD
      remoteRef:
        key: pms/prod/rabbitmq
        property: password