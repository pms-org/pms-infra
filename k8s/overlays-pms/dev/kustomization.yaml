apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Global deployment strategy - includes all PMS resources
resources:
  - ../../base

# Transform all resources to use pms-dev namespace
namespace: pms-dev

labels:
  - pairs:
      environment: dev
      managed-by: kustomize
      project: pms
    includeSelectors: false

# Patches to use emptyDir volumes instead of PVCs for dev environment
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
        - name: pgdata
          emptyDir: {}
    target:
      kind: Deployment
      name: postgres
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
        - name: rabbitmq-data
          emptyDir: {}
    target:
      kind: Deployment
      name: rabbitmq
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
        - name: redis-data
          emptyDir: {}
    target:
      kind: Deployment
      name: redis
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
        - name: kafka-data
          emptyDir: {}
    target:
      kind: Deployment
      name: kafka

# ConfigMap for non-sensitive configuration
# NOTE: DB connection details will come from External Secrets (RDS)
configMapGenerator:
  - name: app-config
    literals:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_STREAM_PORT=5552
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=dev
    options:
      disableNameSuffixHash: true

# RabbitMQ and Kafka credentials (temporary - will move to External Secrets)
secretGenerator:
  - name: rabbitmq-credentials
    literals:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    options:
      disableNameSuffixHash: true
  
  - name: kafka-credentials
    literals:
      - KAFKA_CLUSTER_ID=dOFfvAcdQZKE60Enfcsefg
    options:
      disableNameSuffixHash: true

# Images with dev tags
images:
  - name: niishantdev/pms-simulation
    newTag: dev-latest
  - name: niishantdev/pms-trade-capture
    newTag: dev-latest
  - name: niishantdev/pms-validation
    newTag: dev-latest
