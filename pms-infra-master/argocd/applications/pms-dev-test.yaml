apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pms-dev
  namespace: argocd
  labels:
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: pms-project
  source:
    # For local testing, we'll create a ConfigMap with the manifests
    # In production, this would point to your Git repository
    repoURL: https://github.com/pms-org/pms-infra
    targetRevision: master
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: pms
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Manual sync for testing - change to automated for production
    automated: null
  # Health assessment for custom resources
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
