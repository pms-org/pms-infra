apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pms-stage
  namespace: argocd
  labels:
    environment: stage
spec:
  project: pms-project
  source:
    repoURL: 'https://github.com/pms-org/pms-infra'
    targetRevision: HEAD
    path: k8s/overlays/dev  # Using dev overlay for stage (create stage overlay if needed)
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: pms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
