apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pms-dev-local
  namespace: argocd
  labels:
    environment: dev
spec:
  project: pms-project
  source:
    # For local testing: we'll use declarative sync
    # In production, this would be your Git repository
    path: .
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: pms
  syncPolicy:
    automated:
      prune: false  # Don't prune for testing
      selfHeal: false
    syncOptions:
    - CreateNamespace=true
