apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: pms

labels:
  - pairs:
      environment: prod
      managed-by: kustomize
      project: pms
    includeSelectors: false

# ConfigMap Generators - create ConfigMaps from .properties files
# Note: Properties files are copied from base to avoid Kustomize path restrictions
configMapGenerator:
  - name: simulation-config
    envs:
      - simulation.properties
  - name: validation-config
    envs:
      - validation.properties
  - name: trade-capture-config
    envs:
      - trade-capture.properties
  - name: kafka-config
    envs:
      - kafka.properties
  - name: schema-registry-config
    envs:
      - schema-registry.properties

# Secret Generators - create Secrets from .env files
# In production, consider using External Secrets or Sealed Secrets instead
secretGenerator:
  - name: simulation-secrets
    envs:
      - simulation-secrets.env
  - name: validation-secrets
    envs:
      - validation-secrets.env
  - name: trade-capture-secrets
    envs:
      - trade-capture-secrets.env
  - name: kafka-secrets
    envs:
      - kafka-secrets.env
  - name: postgres-secrets
    envs:
      - postgres-secrets.env
  - name: rabbitmq-secrets
    envs:
      - rabbitmq-secrets.env

# Patches for Production environment
patches:
  # Set replicas to 5 for microservices
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
    target:
      kind: Deployment
      name: simulation
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
    target:
      kind: Deployment
      name: trade-capture
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
    target:
      kind: Deployment
      name: validation-service
  
  # Add resource limits and requests for simulation
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
    target:
      kind: Deployment
      name: simulation
  
  # Add resource limits and requests for trade-capture
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
    target:
      kind: Deployment
      name: trade-capture
  
  # Add resource limits and requests for validation
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
    target:
      kind: Deployment
      name: validation-service
  
  # Add resource limits for infrastructure services
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
    target:
      kind: Deployment
      name: postgres
  
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
    target:
      kind: Deployment
      name: rabbitmq
  
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
    target:
      kind: Deployment
      name: redis
  
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
    target:
      kind: Deployment
      name: kafka
  
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
    target:
      kind: Deployment
      name: schema-registry
