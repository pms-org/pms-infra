apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml

namespace: pms

labels:
  - pairs:
      environment: dev
      managed-by: kustomize
      project: pms
    includeSelectors: false

# ConfigMap Generators - create ConfigMaps from .properties files
configMapGenerator:
  - name: simulation-config
    envs:
      - simulation.properties
  - name: validation-config
    envs:
      - validation.properties
  - name: trade-capture-config
    envs:
      - trade-capture.properties
  - name: kafka-config
    envs:
      - kafka.properties
  - name: schema-registry-config
    envs:
      - schema-registry.properties

# Secret Generators - create Secrets from .env files
secretGenerator:
  - name: simulation-secrets
    envs:
      - simulation.env
  - name: validation-secrets
    envs:
      - validation.env
  - name: trade-capture-secrets
    envs:
      - trade-capture.env
  - name: kafka-secrets
    envs:
      - kafka.env
  - name: postgres-secrets
    envs:
      - postgres.env
  - name: rabbitmq-secrets
    envs:
      - rabbitmq.env

# Patches for Dev environment
patches:
  # Set replicas to 2 for microservices
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: simulation
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: trade-capture
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: validation-service
  
  # Use emptyDir for volumes in dev (no PVCs)
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
        - name: pgdata
          emptyDir: {}
    target:
      kind: Deployment
      name: postgres
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
        - name: rabbitmq-data
          emptyDir: {}
    target:
      kind: Deployment
      name: rabbitmq
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
        - name: redis-data
          emptyDir: {}
    target:
      kind: Deployment
      name: redis
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
        - name: kafka-data
          emptyDir: {}
    target:
      kind: Deployment
      name: kafka
