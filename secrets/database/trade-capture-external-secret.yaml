# ExternalSecret for trade-capture database credentials
# Service-owned: trade-capture declares its database dependencies
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: trade-capture-database
  namespace: pms
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: trade-capture-database
    creationPolicy: Owner

  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: pms/database/prod
        property: username

    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: pms/database/prod
        property: password

    - secretKey: DATASOURCE_USER
      remoteRef:
        key: pms/database/prod
        property: username

    - secretKey: DATASOURCE_PASS
      remoteRef:
        key: pms/database/prod
        property: password