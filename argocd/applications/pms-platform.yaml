apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pms-platform
  namespace: argocd
  labels:
    environment: dev
spec:
  project: pms-project
  source:
    repoURL: "https://github.com/pms-org/pms-infra"
    targetRevision: HEAD
    path: k8s/pms-platform
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: pms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
