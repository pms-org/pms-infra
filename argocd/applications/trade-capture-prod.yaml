apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pms-prod
  namespace: argocd
  labels:
    environment: prod
spec:
  project: pms-project
  source:
    repoURL: 'https://github.com/pms-org/pms-infra'
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: pms
  # No automated sync: prod is managed manually in Argo CD
  syncPolicy: {}

