# Test secret for local postgres connectivity testing
apiVersion: v1
kind: Secret
metadata:
  name: trade-capture-database-test
  namespace: pms
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "pms"
  SPRING_DATASOURCE_PASSWORD: "pms"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/pmsdb"
  DATASOURCE_USER: "pms"
  DATASOURCE_PASS: "pms"
---
# Test RabbitMQ secret for local testing
apiVersion: v1
kind: Secret
metadata:
  name: trade-capture-rabbitmq-test
  namespace: pms
type: Opaque
stringData:
  SPRING_RABBITMQ_USERNAME: "guest"
  SPRING_RABBITMQ_PASSWORD: "guest"
  APP_RABBIT_STREAM_USERNAME: "guest"
  APP_RABBIT_STREAM_PASSWORD: "guest"