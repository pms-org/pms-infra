apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pms

# Test configuration for RDS connectivity testing
resources:
  - ../apps
  - test-rds-secret.yaml

# Override the external secrets with local test secrets and update env vars for RDS
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
        value: trade-capture-database-test
    target:
      kind: Deployment
      name: trade-capture
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: trade-capture-rabbitmq-test
    target:
      kind: Deployment
      name: trade-capture
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "jdbc:postgresql://postgres:5432/pmsdb"
    target:
      kind: Deployment
      name: trade-capture
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: "postgres"
    target:
      kind: Deployment
      name: trade-capture
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/5/value
        value: "pmsdb"
    target:
      kind: Deployment
      name: trade-capture

labels:
  - pairs:
      environment: prod-test
      managed-by: kustomize