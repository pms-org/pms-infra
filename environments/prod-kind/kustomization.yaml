apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pms-prod

# Prod environment for kind testing: applications only (no platform infrastructure)
resources:
  - ../../apps

labels:
  - pairs:
      environment: prod
      managed-by: kustomize
    includeSelectors: false

# Remove init containers that wait for services not deployed in prod
patches:
  - patch: |-
      - op: remove
        path: /spec/template/spec/initContainers
    target:
      kind: Deployment
      name: trade-capture
  - patch: |-
      - op: remove
        path: /spec/template/spec/initContainers
    target:
      kind: Deployment
      name: simulation
  - patch: |-
      - op: remove
        path: /spec/template/spec/initContainers
    target:
      kind: Deployment
      name: validation-service
  # Update simulation to use external service endpoints (simulating production)
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
        - name: RABBITMQ_HOST
          value: "external-rabbitmq.amazonaws.com"
        - name: RABBITMQ_STREAM_PORT
          value: "5552"
        - name: RABBITMQ_STREAM_NAME
          value: "trade-stream"
        - name: DB_HOST
          value: "external-postgres.amazonaws.com"
        - name: DB_NAME
          value: "pmsdb"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://external-postgres.amazonaws.com:5432/pmsdb"
        - name: SPRING_DATASOURCE_USERNAME
          value: "pms"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "pms"
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: "org.postgresql.Driver"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.PostgreSQLDialect"
        - name: SPRING_JPA_SHOW_SQL
          value: "false"
        - name: SERVER_PORT
          value: "4000"
    target:
      kind: Deployment
      name: simulation
  # Update trade-capture to use external service endpoints (simulating production)
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://external-postgres.amazonaws.com:5432/pmsdb"
        - name: SPRING_RABBITMQ_HOST
          value: "external-rabbitmq.amazonaws.com"
        - name: SPRING_RABBITMQ_PORT
          value: "5672"
        - name: DB_HOST
          value: "external-postgres.amazonaws.com"
        - name: DB_NAME
          value: "pmsdb"
        - name: DATASOURCE_HIKARI_POOL_SIZE
          value: "20"
        - name: JPA_OPEN_IN_VIEW
          value: "false"
        - name: JDBC_BATCH_SIZE
          value: "500"
        - name: APP_RABBIT_STREAM_HOST
          value: "external-rabbitmq.amazonaws.com"
        - name: APP_RABBIT_STREAM_PORT
          value: "5552"
        - name: APP_RABBIT_STREAM_NAME
          value: "trade-stream"
        - name: APP_RABBIT_STREAM_CONSUMER_NAME
          value: "trade-capture-group"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "external-kafka.amazonaws.com:9092"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "external-kafka.amazonaws.com:9092"
        - name: SCHEMA_REGISTRY_URL
          value: "http://external-schema-registry.amazonaws.com:8081"
        - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
          value: "org.apache.kafka.common.serialization.StringSerializer"
        - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
          value: "io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer"
        - name: SPRING_KAFKA_PRODUCER_PROPERTIES_SCHEMA_REGISTRY_URL
          value: "http://external-schema-registry.amazonaws.com:8081"
        - name: SPRING_KAFKA_PRODUCER_PROPERTIES_AUTO_REGISTER_SCHEMAS
          value: "true"
        - name: BATCH_SIZE
          value: "500"
        - name: BATCH_TIMEOUT_MS
          value: "100"
    target:
      kind: Deployment
      name: trade-capture

# ConfigMap for non-sensitive configuration
configMapGenerator:
  - name: app-config
    literals:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_STREAM_PORT=5552
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=prod
      - LOG_LEVEL=INFO
    options:
      disableNameSuffixHash: true

# Test secrets for kind deployment (simulating external secrets)
secretGenerator:
  - name: trade-capture-database
    literals:
      - SPRING_DATASOURCE_USERNAME=pms
      - SPRING_DATASOURCE_PASSWORD=pms
      - DATASOURCE_USER=pms
      - DATASOURCE_PASS=pms
  - name: trade-capture-rabbitmq
    literals:
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - APP_RABBIT_STREAM_USERNAME=guest
      - APP_RABBIT_STREAM_PASSWORD=guest