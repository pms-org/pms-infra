# ExternalSecret for trade-capture RabbitMQ credentials
# Service-owned: trade-capture declares its messaging dependencies
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: trade-capture-rabbitmq
  namespace: pms
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: trade-capture-rabbitmq
    creationPolicy: Owner

  data:
    - secretKey: SPRING_RABBITMQ_USERNAME
      remoteRef:
        key: pms/rabbitmq/prod
        property: username

    - secretKey: SPRING_RABBITMQ_PASSWORD
      remoteRef:
        key: pms/rabbitmq/prod
        property: password

    - secretKey: APP_RABBIT_STREAM_USERNAME
      remoteRef:
        key: pms/rabbitmq/prod
        property: username

    - secretKey: APP_RABBIT_STREAM_PASSWORD
      remoteRef:
        key: pms/rabbitmq/prod
        property: password