apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pms

# Prod environment: applications only (platform infrastructure is managed by Terraform)
resources:
  - ../../apps

# AWS addons for prod (External Secrets Operator)
  - aws-addons/secret-store.yaml
  - aws-addons/service-account.yaml

# Service-owned external secrets
  - secrets/trade-capture-database-external-secret.yaml
  - secrets/trade-capture-rabbitmq-external-secret.yaml

labels:
  - pairs:
      environment: prod
      managed-by: kustomize
    includeSelectors: false

# ConfigMap for non-sensitive configuration
# NOTE: DB connection details will come from External Secrets (RDS Multi-AZ)
configMapGenerator:
  - name: app-config
    literals:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_STREAM_PORT=5552
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=prod
      - LOG_LEVEL=INFO
    options:
      disableNameSuffixHash: true

# RabbitMQ and Kafka credentials (will move to External Secrets)
# TODO PHASE 5: Replace with ExternalSecret references
secretGenerator:
  - name: rabbitmq-credentials
    literals:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=CHANGEME_USE_EXTERNAL_SECRETS
    options:
      disableNameSuffixHash: true

  - name: kafka-credentials
    literals:
      - KAFKA_CLUSTER_ID=PROD_CLUSTER_ID_HERE